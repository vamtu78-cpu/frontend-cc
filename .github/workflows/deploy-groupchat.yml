name: Deploy group chat

# 群聊代码有改动就自动部署到 VPS（和聊天 App 共用同一套 SSH Secret）
# 群聊的全部配置（口令、两个 AI 的 key/人设）放在 Secret「GROUPCHAT_CONFIG」里，不进仓库
on:
  push:
    branches: [ claude/confident-hamilton-podywp, claude/frontend-chat-app-kp2vju ]
    paths:
      - 'groupchat/**'
      - 'scripts/groupchat-remote.sh'
      - '.github/workflows/deploy-groupchat.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 检查群聊配置
        id: check
        env:
          GROUPCHAT_CONFIG: ${{ secrets.GROUPCHAT_CONFIG }}
        run: |
          if [ -z "$GROUPCHAT_CONFIG" ]; then
            echo "::notice::还没添加 Secret「GROUPCHAT_CONFIG」，先跳过部署（见 groupchat/README.md）"
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          node scripts/groupchat-check-config.mjs "$RUNNER_TEMP/groupchat-config.json"

      - name: 部署到 VPS
        if: steps.check.outputs.skip != '1'
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          set -e
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_key
          chmod 600 ~/.ssh/id_key
          ssh-keyscan -p "$PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -p $PORT -i ~/.ssh/id_key $SSH_USER@$SSH_HOST"
          S=""; [ "$SSH_USER" = root ] || S=sudo

          $SSH "$S mkdir -p /opt/groupchat/data && $S chown -R \$(id -u) /opt/groupchat"
          rsync -az --delete --exclude data --exclude node --exclude config.json --exclude '*.bak' \
            -e "ssh -p $PORT -i ~/.ssh/id_key" groupchat/server.js groupchat/public "$SSH_USER@$SSH_HOST:/opt/groupchat/"
          $SSH "umask 077 && cat > /opt/groupchat/config.json" < "$RUNNER_TEMP/groupchat-config.json"
          $SSH "SITE_DIR='${TARGET_DIR:-/var/www/liquid-chat}' bash -s" < scripts/groupchat-remote.sh
