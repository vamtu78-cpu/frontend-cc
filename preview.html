<title>AI 聊天雏形</title>
<style>
  :root {
    --bg-a: #0f172a;
    --bg-b: #1e293b;
    --bg-c: #1e1b4b;
    --card: rgba(15, 23, 42, 0.6);
    --border: rgba(255, 255, 255, 0.1);
    --text: #f1f5f9;
    --muted: #64748b;
    --ai-bubble: #1e293b;
    --accent-a: #6366f1;
    --accent-b: #d946ef;
    --user-a: #6366f1;
    --user-b: #d946ef;
    --online: #34d399;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, var(--bg-a), var(--bg-b) 55%, var(--bg-c));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    color: var(--text);
  }

  .card {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 42rem;
    height: min(85vh, 720px);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(20px);
    overflow: hidden;
  }

  /* header */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  .avatar-lg {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 16px;
    font-size: 18px;
    background: linear-gradient(135deg, #818cf8, var(--accent-b));
    box-shadow: 0 8px 20px -6px rgba(99, 102, 241, 0.6);
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  .status {
    display: flex; align-items: center; gap: 6px;
    margin: 2px 0 0; font-size: 12px; color: var(--online);
  }
  .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--online); }

  /* messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb {
    background: rgba(148, 163, 184, 0.3); border-radius: 999px;
  }

  .row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    animation: fadeUp 0.35s ease-out;
  }
  .row.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 999px; font-size: 14px;
    box-shadow: 0 4px 10px -4px rgba(0,0,0,0.5);
  }
  .avatar.ai { background: linear-gradient(135deg, #818cf8, var(--accent-b)); }
  .avatar.user { background: linear-gradient(135deg, #38bdf8, #3b82f6); }

  .bubble {
    max-width: 75%;
    padding: 10px 16px;
    font-size: 14px;
    line-height: 1.6;
    border-radius: 16px;
    white-space: pre-wrap;
    word-break: break-word;
    box-shadow: 0 4px 12px -4px rgba(0,0,0,0.4);
  }
  .bubble.ai { background: var(--ai-bubble); color: var(--text); border-bottom-left-radius: 6px; }
  .bubble.user {
    background: linear-gradient(135deg, var(--user-a), var(--user-b));
    color: #fff; border-bottom-right-radius: 6px;
  }

  /* typing */
  .typing { display: flex; gap: 4px; padding: 12px 16px; }
  .typing span {
    width: 8px; height: 8px; border-radius: 999px; background: #94a3b8;
    animation: bounceDot 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  /* input */
  .composer { padding: 14px; border-top: 1px solid var(--border); }
  .inputbar {
    display: flex; align-items: flex-end; gap: 8px;
    background: rgba(30, 41, 59, 0.8);
    border-radius: 16px;
    padding: 8px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
    transition: box-shadow 0.15s;
  }
  .inputbar:focus-within { box-shadow: inset 0 0 0 1px rgba(99,102,241,0.5); }
  textarea {
    flex: 1; resize: none; border: none; outline: none; background: transparent;
    color: var(--text); font-family: inherit; font-size: 14px;
    padding: 8px 12px; max-height: 128px; line-height: 1.5;
  }
  textarea::placeholder { color: var(--muted); }
  .send {
    width: 40px; height: 40px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 12px; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    box-shadow: 0 8px 20px -6px rgba(99,102,241,0.6);
    transition: opacity 0.15s, transform 0.1s;
  }
  .send:hover { opacity: 0.9; }
  .send:active { transform: scale(0.95); }
  .send:disabled { opacity: 0.4; cursor: not-allowed; }
  .send svg { width: 20px; height: 20px; fill: currentColor; }

  .demo-note {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: rgba(241,245,249,0.5);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes bounceDot {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-4px); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .row, .typing span { animation: none; }
  }
</style>

<div class="card">
  <header>
    <div class="avatar-lg">🤖</div>
    <div>
      <h1>我的 AI 聊天</h1>
      <p class="status"><span class="dot"></span>在线（当前为测试模式）</p>
    </div>
  </header>

  <div class="messages" id="messages"></div>

  <div class="composer">
    <div class="inputbar">
      <textarea id="input" rows="1" placeholder="说点什么…（回车发送，Shift+回车换行）"></textarea>
      <button class="send" id="send" aria-label="发送">
        <svg viewBox="0 0 24 24"><path d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a.993.993 0 00-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="demo-note">这是在线预览 · 仓库里跑出来的界面与此一致</div>

<script>
  const FAKE_REPLIES = [
    '收到～这是一条假回复😋 界面跑通啦！',
    '我现在还没接真的大模型，先陪你测试界面～',
    '气泡、动画、滚动都正常的话，就说明雏形成功啦🎉',
    '想改配色的话，找 App.jsx 里带颜色的那些 class 改就行。',
    '等你玩顺了，跟 cc 说一声，就能把我换成真的 AI 啦🥰',
  ];

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendEl = document.getElementById('send');
  let typing = false;

  function scrollDown() {
    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
  }

  function addBubble(role, text) {
    const row = document.createElement('div');
    row.className = 'row ' + role;
    const avatar = document.createElement('div');
    avatar.className = 'avatar ' + role;
    avatar.textContent = role === 'user' ? '🧑' : '🤖';
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + role;
    bubble.textContent = text;
    row.append(avatar, bubble);
    messagesEl.append(row);
    scrollDown();
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'row ai';
    row.id = 'typing-row';
    row.innerHTML =
      '<div class="avatar ai">🤖</div>' +
      '<div class="bubble ai" style="padding:0"><div class="typing"><span></span><span></span><span></span></div></div>';
    messagesEl.append(row);
    scrollDown();
  }
  function hideTyping() {
    document.getElementById('typing-row')?.remove();
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || typing) return;
    addBubble('user', text);
    inputEl.value = '';
    inputEl.style.height = 'auto';
    typing = true;
    sendEl.disabled = true;
    showTyping();
    const reply = FAKE_REPLIES[Math.floor(Math.random() * FAKE_REPLIES.length)];
    await new Promise((r) => setTimeout(r, 800 + Math.random() * 800));
    hideTyping();
    addBubble('ai', reply);
    typing = false;
    sendEl.disabled = false;
    inputEl.focus();
  }

  sendEl.addEventListener('click', send);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 128) + 'px';
  });

  // 开场白
  addBubble('ai', '嗨～我是你的 AI 小助手，随便跟我说点什么吧！');
</script>
