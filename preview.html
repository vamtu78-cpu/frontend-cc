<title>液态玻璃聊天</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* 统一用 100vh，避免 iOS PWA 底部白边（不要混用 100% / 100dvh / fixed body）*/
  html, body { height: 100vh; margin: 0; }
  body {
    font-family: var(--app-font);
    background: #0b1016;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  :root {
    --app-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Inter", system-ui, sans-serif;
    --bub-radius: 23px; --bub-padx: 20px; --bub-pady: 9px; --bub-maxw: 72%;
    --msg-font: 17px; --avatar-size: 34px;
    --set-bg: rgba(22,28,36,0.86); --set-accent: #8fa2c9;
  }

  .phone {
    position: relative; isolation: isolate;
    width: 100%; max-width: 402px;
    height: 100vh;              /* 真机铺满整屏，消除底部白边 */
    overflow: hidden; color: #fff;
    display: flex; flex-direction: column;
    background: #12181f;
  }
  /* 只有宽屏（电脑预览）才把它做成"手机框"，限高 + 圆角 */
  @media (min-width: 440px) {
    .phone { height: 874px; max-height: 92vh; border-radius: 44px; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.8); }
  }

  #gl { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }

  /* 顶部渐变模糊遮罩：内容上滑时从顶部虚化露出 */
  .top-fade {
    position: absolute; top: 0; left: 0; right: 0; z-index: 3; pointer-events: none;
    height: calc(env(safe-area-inset-top) + 104px);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    -webkit-mask-image: linear-gradient(to bottom, #000 42%, transparent);
    mask-image: linear-gradient(to bottom, #000 42%, transparent);
  }

  /* ===== 顶栏 ===== */
  .topbar {
    position: relative; z-index: 4;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    /* 顶部叠加安全区，避开灵动岛/状态栏 */
    padding: calc(4px + env(safe-area-inset-top)) 16px 10px;
  }
  .glass {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: 0 6px 20px rgba(0,0,0,0.20);
  }
  .glass-circle {
    width: 46px; height: 46px; flex-shrink: 0; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; cursor: pointer; padding: 0;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .glass-circle svg { width: 22px; height: 22px; }

  .name-capsule {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 5px 18px 5px 5px; border-radius: 999px; max-width: 62%;
  }
  .cap-avatar {
    width: 34px; height: 34px; flex-shrink: 0; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, #7c8ce0, #cf6bd6);
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.4); overflow: hidden;
  }
  .cap-avatar img, .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 999px; }
  .cap-name { font-size: 16px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.3); white-space: nowrap; }
  .topbar-spacer { width: 46px; flex-shrink: 0; }

  /* ===== 消息 ===== */
  .messages {
    position: relative; z-index: 2;
    flex: 1; overflow-y: auto;
    padding: 8px 14px 6px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .messages::-webkit-scrollbar { width: 0; }

  .row { display: flex; align-items: center; gap: 8px; animation: fadeUp 0.3s ease-out; }
  .row.right { justify-content: flex-end; }
  .row.multiline { align-items: flex-start; }

  .avatar {
    width: var(--avatar-size); height: var(--avatar-size); flex-shrink: 0; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--avatar-size) * 0.47); font-weight: 600; color: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,0.3), inset 0 1px 2px rgba(255,255,255,0.35);
    overflow: hidden;
  }
  .avatar-ai   { background: linear-gradient(135deg, #7c8ce0, #cf6bd6); }
  .avatar-user { background: linear-gradient(135deg, #56b6f4, #3b7bf0); }

  .message {
    position: relative;
    display: inline-flex; align-items: center;
    max-width: var(--bub-maxw);
    padding: var(--bub-pady) var(--bub-padx);
    border-radius: var(--bub-radius);
    font-size: var(--msg-font); line-height: 1.4;
  }
  .message span {
    position: relative; z-index: 2;
    white-space: pre-wrap; word-break: break-word;
    color: rgba(255,255,255,0.96);
    text-shadow: 0 1px 2px rgba(0,0,0,0.28);
  }

  .typing { display: flex; gap: 5px; }
  .typing i {
    width: 8px; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.9);
    animation: bounceDot 1.2s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: 0.2s; }
  .typing i:nth-child(3) { animation-delay: 0.4s; }

  /* ===== 输入栏 ===== */
  .composer { position: relative; z-index: 2; padding: 10px 14px calc(2px + env(safe-area-inset-bottom)); }
  .attach-strip { display: flex; gap: 8px; padding: 0 4px 8px; overflow-x: auto; }
  .attach-strip::-webkit-scrollbar { height: 0; }
  .attach-thumb { position: relative; width: 56px; height: 56px; flex-shrink: 0; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.25); }
  .attach-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .attach-thumb button { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 999px; background: rgba(0,0,0,0.6); color: #fff; border: none; font-size: 11px; line-height: 1; cursor: pointer; padding: 0; }
  .msg-img { display: block; max-width: 190px; max-height: 240px; border-radius: 12px; margin-bottom: 6px; }
  .msg-img:last-child { margin-bottom: 0; }
  .inputbar { display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 10px; border-radius: 999px; }
  .icon-btn, .send {
    flex-shrink: 0; border-radius: 999px; color: #fff; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid rgba(255,255,255,0.22);
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .icon-btn { width: 40px; height: 40px; font-size: 22px; }
  .send { width: 46px; height: 46px; transition: transform 0.1s; }
  .send:active { transform: scale(0.92); }
  .send svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }
  textarea {
    flex: 1; resize: none; border: none; outline: none; background: transparent;
    color: #fff; font-family: inherit; font-size: 16px; line-height: 1.4;
    padding: 8px 4px; max-height: 110px; text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  textarea::placeholder { color: rgba(255,255,255,0.6); }

  /* ===== 功能抽屉 ===== */
  .overlay { position: absolute; inset: 0; z-index: 10; display: flex; }
  .overlay[hidden] { display: none; }
  #menu-overlay {
    justify-content: flex-start;
    background: rgba(8,12,18,0.35);
    backdrop-filter: blur(18px) saturate(120%); -webkit-backdrop-filter: blur(18px) saturate(120%);
  }
  .drawer {
    width: 264px; height: 100%; padding: 26px 16px;
    background: var(--set-bg);
    border-right: 1px solid rgba(255,255,255,0.14);
    box-shadow: 20px 0 60px -20px rgba(0,0,0,0.7);
    animation: slideIn 0.25s cubic-bezier(0.2,0.8,0.2,1);
    display: flex; flex-direction: column;
  }
  .drawer-title { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin: 6px 8px 14px; }
  .menu-item {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: 16px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    color: #fff; font-size: 15px; cursor: pointer; text-align: left;
  }
  .menu-item:hover { background: rgba(255,255,255,0.12); }
  .mi-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
  .mi-icon svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; }

  /* 聊天窗口列表 */
  #window-list { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .win-item {
    display: flex; align-items: center; gap: 6px; padding: 9px 12px; border-radius: 12px;
    background: rgba(255,255,255,0.04); border: 1px solid transparent; cursor: pointer;
  }
  .win-item.active { background: color-mix(in srgb, var(--set-accent) 28%, transparent); border-color: rgba(255,255,255,0.18); }
  .win-title { flex: 1; font-size: 13px; color: rgba(255,255,255,0.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .win-del {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 999px; padding: 0;
    background: transparent; border: none; color: rgba(255,255,255,0.5); font-size: 13px; cursor: pointer;
  }
  .win-del:hover { color: #ff9a9a; }

  /* ===== 设置：底部弹出面板（上方露出真实聊天=实时预览）===== */
  #settings-overlay, .overlay.bottom { align-items: flex-end; background: transparent; }
  /* 面板里的文字输入 */
  .fld { display: block; font-size: 12px; color: rgba(255,255,255,0.82); margin-bottom: 14px; }
  .fld input, .fld textarea {
    display: block; width: 100%; margin-top: 7px;
    background: rgba(255,255,255,0.08); color: #fff;
    border: 1px solid rgba(255,255,255,0.18); border-radius: 12px;
    padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none;
    -webkit-appearance: none;
  }
  .fld textarea { resize: vertical; line-height: 1.5; }
  .fld input:focus, .fld textarea:focus { border-color: var(--set-accent); }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(255,255,255,0.85); margin: 2px 0 14px; cursor: pointer; }
  .chk input { width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--set-accent); }

  /* 颜色选择行 */
  .color-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; font-size: 13px; color: rgba(255,255,255,0.85); }
  .color-row input[type=color] {
    width: 42px; height: 30px; flex-shrink: 0; padding: 0; border: 1px solid rgba(255,255,255,0.25);
    border-radius: 9px; background: transparent; cursor: pointer;
  }
  .color-row input[type=color]::-webkit-color-swatch-wrapper { padding: 3px; }
  .color-row input[type=color]::-webkit-color-swatch { border: none; border-radius: 6px; }

  /* 面板毛玻璃 */
  .sheet { backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%); }

  /* 思维链弹窗：固定大尺寸，不随内容缩放 */
  .think-sheet {
    height: 78%; max-height: 78%; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .think-title { text-align: center; font-weight: 800; margin: 4px 0 0; }
  .think-body {
    flex: 1; margin-top: 22px;                 /* 与标题空约一行 */
    font-size: 14px; line-height: 1.7; color: rgba(255,255,255,0.82);
    white-space: pre-wrap; word-break: break-word;
    overflow-y: auto; padding-bottom: 6px;
  }
  .think-body::-webkit-scrollbar { width: 0; }
  /* 有思考过程的 AI 头像：可点 + 右上角 ✦ 标记(头像外) */
  .avatar.has-think { cursor: pointer; position: relative; overflow: visible; }
  .avatar.has-think::after {
    content: '✦'; position: absolute; top: -7px; right: -7px;
    font-size: 13px; line-height: 1; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6); pointer-events: none;
  }
  .sheet {
    width: 100%; max-height: 70%; overflow-y: auto;
    padding: 10px 20px 22px; border-radius: 26px 26px 0 0;
    background: var(--set-bg);
    border-top: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 -20px 60px -14px rgba(0,0,0,0.7);
    animation: sheetUp 0.26s cubic-bezier(0.2,0.8,0.2,1);
  }
  .sheet::-webkit-scrollbar { width: 0; }
  .grab { width: 40px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.3); margin: 2px auto 12px; }
  .sheet-title { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
  .sheet-hint { font-size: 12px; color: rgba(255,255,255,0.5); margin: 0 0 16px; }
  .sec { margin-bottom: 20px; }
  .sec-head {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; letter-spacing: 0.05em; color: rgba(255,255,255,0.55);
    text-transform: uppercase; margin-bottom: 10px;
  }
  .btn-row { display: flex; gap: 10px; }
  .btn {
    color: #fff; cursor: pointer; font-size: 14px;
    background: color-mix(in srgb, var(--set-accent) 32%, transparent);
    border: 1px solid rgba(255,255,255,0.22); border-radius: 999px; padding: 9px 16px;
  }
  .btn.small { font-size: 12px; padding: 4px 12px; }
  .btn.flex { flex: 1; text-align: center; }
  .sheet label { display: block; font-size: 12px; color: rgba(255,255,255,0.82); margin-bottom: 12px; }
  .sheet output { float: right; font-variant-numeric: tabular-nums; color: #fff; font-weight: 600; }
  .sheet input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 4px;
    margin-top: 9px; border-radius: 999px; background: rgba(255,255,255,0.22); outline: none;
  }
  .sheet input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 999px;
    background: var(--set-accent); cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .sheet input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px; border: none; border-radius: 999px; background: var(--set-accent); cursor: pointer;
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes bounceDot { 0%,80%,100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-4px); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .row, .typing i, .drawer, .sheet { animation: none; } }
</style>

<div class="phone" id="phone">
  <canvas id="gl"></canvas>
  <div class="top-fade"></div>

  <div class="topbar">
    <button class="glass glass-circle" id="menu-btn" aria-label="菜单" data-side="left" data-color="neutral">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="glass name-capsule" id="name-capsule" data-side="left" data-color="ai">
      <span class="cap-avatar" id="cap-avatar"></span>
      <span class="cap-name" id="cap-name">言</span>
    </div>
    <span class="topbar-spacer"></span>
  </div>

  <div class="messages" id="messages"></div>

  <div class="composer">
    <div class="attach-strip" id="attach-strip" hidden></div>
    <div class="glass inputbar" data-side="left" data-color="neutral">
      <button class="icon-btn" id="plus-btn" aria-label="添加图片">＋</button>
      <textarea id="input" rows="1" placeholder="Type a message..."></textarea>
      <button class="send" id="send" aria-label="发送">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </div>

  <!-- 功能抽屉 -->
  <div class="overlay" id="menu-overlay" hidden>
    <div class="drawer" id="drawer">
      <div class="drawer-title">聊天窗口</div>
      <button class="menu-item" id="new-chat">
        <span class="mi-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
        <span>新建对话</span>
      </button>
      <div id="window-list"></div>

      <div class="drawer-title" style="margin-top:18px">功能</div>
      <button class="menu-item" id="open-settings">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </span>
        <span>设置</span>
      </button>
      <button class="menu-item" id="open-api">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18" cy="17" r="2.4"/></svg>
        </span>
        <span>API 配置</span>
      </button>
      <button class="menu-item" id="open-persona">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        </span>
        <span>设定（人设）</span>
      </button>
      <button class="menu-item" id="open-memory">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24"><path d="M12 3a4 4 0 0 0-4 4v1a3 3 0 0 0 0 6 3 3 0 0 0 4 3 3 3 0 0 0 4-3 3 3 0 0 0 0-6V7a4 4 0 0 0-4-4z"/><path d="M12 3v18"/></svg>
        </span>
        <span>记忆</span>
      </button>
    </div>
  </div>

  <!-- API 配置 -->
  <div class="overlay bottom" id="api-overlay" hidden>
    <div class="sheet">
      <div class="grab"></div>
      <div class="sheet-title">API 配置</div>
      <p class="sheet-hint">支持 OpenAI 格式的中转/官方接口，密钥仅存在本机浏览器</p>
      <label class="fld">接口地址 (Base URL)
        <input type="text" id="api-base" placeholder="https://你的中转/v1" autocapitalize="off" autocomplete="off" spellcheck="false">
      </label>
      <label class="fld">API Key
        <input type="password" id="api-key" placeholder="sk-..." autocapitalize="off" autocomplete="off" spellcheck="false">
      </label>
      <label class="fld">模型
        <input type="text" id="api-model" placeholder="gpt-4o-mini / claude-3-5-sonnet ..." autocapitalize="off" autocomplete="off" spellcheck="false">
      </label>
      <label class="fld">温度（创意度）<output id="api-temp-v"></output>
        <input type="range" id="api-temp" min="0" max="2" step="0.05">
      </label>
      <label class="fld">上下文条数（带几条历史）<output id="api-ctx-v"></output>
        <input type="range" id="api-ctx" min="2" max="60" step="1">
      </label>
      <label class="fld">最大回复长度（留空 = 不限）
        <input type="text" id="api-maxtok" inputmode="numeric" placeholder="如 2048" autocomplete="off">
      </label>
      <div class="btn-row" style="margin-top:4px">
        <button class="btn flex" id="api-test">测试连接</button>
        <button class="btn flex" id="api-save">保存</button>
      </div>
      <p class="sheet-hint" id="api-status" style="margin-top:10px"></p>
    </div>
  </div>

  <!-- 设定（人设 / 系统提示）-->
  <div class="overlay bottom" id="persona-overlay" hidden>
    <div class="sheet">
      <div class="grab"></div>
      <div class="sheet-title">设定</div>
      <p class="sheet-hint">给 AI 的人设 / 系统提示，会作为对话的开场设定</p>
      <label class="fld">昵称
        <input type="text" id="persona-name" placeholder="言">
      </label>
      <label class="fld">人设内容
        <textarea id="persona-text" rows="7" placeholder="例如：你是我的老公，说话温柔、爱撒娇，会用中文回复我……"></textarea>
      </label>
      <label class="chk"><input type="checkbox" id="split-toggle"> 像真人一样分条发送（把回复拆成多条短消息）</label>
      <button class="btn flex" id="persona-save" style="width:100%">保存</button>
    </div>
  </div>

  <!-- 记忆 -->
  <div class="overlay bottom" id="memory-overlay" hidden>
    <div class="sheet">
      <div class="grab"></div>
      <div class="sheet-title">记忆</div>

<script>
/* ===== 昵称 / 头像 ===== */
let nickname = '言';
try { nickname = localStorage.getItem('lg-nick') || '言'; } catch(e){}
let AI_TEXT = nickname.slice(0, 1) || '言';
const USER_TEXT = '🧑';
let aiAvatarSrc = null, userAvatarSrc = null;
try { aiAvatarSrc = localStorage.getItem('lg-ai-avatar') || null; userAvatarSrc = localStorage.getItem('lg-user-avatar') || null; } catch(e){}

document.getElementById('cap-name').textContent = nickname;
function avatarHTML(side){
  const src = side === 'right' ? userAvatarSrc : aiAvatarSrc;
  if(src) return '<img src="' + src + '" alt="">';
  return side === 'right' ? USER_TEXT : AI_TEXT;
}
function applyAvatars(){
  const cap = document.getElementById('cap-avatar');
  cap.innerHTML = avatarHTML('left');
  document.querySelectorAll('.avatar-ai').forEach(a => a.innerHTML = avatarHTML('left'));
  document.querySelectorAll('.avatar-user').forEach(a => a.innerHTML = avatarHTML('right'));
}
function setAvatar(side, dataURL){
  if(side === 'right'){ userAvatarSrc = dataURL; try { localStorage.setItem('lg-user-avatar', dataURL); } catch(e){} }
  else { aiAvatarSrc = dataURL; try { localStorage.setItem('lg-ai-avatar', dataURL); } catch(e){} }
  applyAvatars();
}

/* ===== 液态玻璃 WebGL ===== */
const MAX = 28;
const VERT = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.0,1.0); }`;
const FRAG = `
precision highp float;
uniform vec2 uRes; uniform sampler2D uTex; uniform int uCount;
uniform vec4 uRect[${MAX}]; uniform vec2 uMeta[${MAX}];
uniform vec2 uLight;
uniform float uStrength, uEdge, uChroma, uGlow, uRimPow, uTint, uBlur;
uniform vec3 uColAI, uColUser, uColNeutral;
float sdRound(vec2 p, vec2 c, vec2 hw, float r){
  vec2 q = abs(p-c) - hw + r;
  return min(max(q.x,q.y),0.0) + length(max(q,0.0)) - r;
}
float scene(vec2 p, out float side){
  float d = 1e9; side = 0.0;
  for(int i=0;i<${MAX};i++){ if(i>=uCount) break;
    vec4 R = uRect[i];
    float di = sdRound(p, R.xy, R.zw, uMeta[i].x);
    if(di < d){ d = di; side = uMeta[i].y; } }
  return d;
}
float sceneD(vec2 p){ float s; return scene(p,s); }
vec3 bg(vec2 p){ return texture2D(uTex, vec2(p.x/uRes.x, p.y/uRes.y)).rgb; }
// 玻璃磨砂：对背景做小范围多点模糊
vec3 bgB(vec2 p, float rad){
  vec3 s = bg(p);
  if(rad > 0.5){
    s += bg(p+vec2(rad,0.0)) + bg(p+vec2(-rad,0.0)) + bg(p+vec2(0.0,rad)) + bg(p+vec2(0.0,-rad));
    float r2 = rad * 0.7071;
    s += bg(p+vec2(r2,r2)) + bg(p+vec2(-r2,r2)) + bg(p+vec2(r2,-r2)) + bg(p+vec2(-r2,-r2));
    s /= 9.0;
  }
  return s;
}
void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  float side; float d = scene(p, side);
  vec3 col = bg(p);
  float alpha = smoothstep(1.0, -1.0, d);
  if(alpha > 0.001){
    float e = 1.5;
    vec2 g = normalize(vec2(sceneD(p+vec2(e,0.))-sceneD(p-vec2(e,0.)),
                            sceneD(p+vec2(0.,e))-sceneD(p-vec2(0.,e))) + 1e-6);
    float rim = 1.0 - smoothstep(0.0, uEdge, -d);
    rim = pow(rim, uRimPow);
    vec2 off = g * uStrength * rim;
    vec3 refr;
    refr.r = bgB(p + off*(1.0+uChroma), uBlur).r;
    refr.g = bgB(p + off, uBlur).g;
    refr.b = bgB(p + off*(1.0-uChroma), uBlur).b;
    vec3 tint = uColNeutral;
    if(side < 0.5) tint = uColAI;
    else if(side < 1.5) tint = uColUser;
    float tintA = uTint;
    vec3 glass = mix(refr, tint, tintA);
    glass += vec3(uGlow) * pow(rim, 2.5);
    float spec = pow(max(dot(normalize(-g), normalize(uLight)),0.0), 24.0) * rim;
    glass += vec3(1.0) * spec * 0.5;
    col = mix(col, glass, alpha);
  }
  gl_FragColor = vec4(col, 1.0);
}`;

const phone = document.getElementById('phone');
const canvas = document.getElementById('gl');
let gl, prog, loc = {}, tex, dpr = Math.min(devicePixelRatio || 1, 2);
let light = [0.0, -1.0];

const DEFAULTS = { strength:48, edge:12, rimPow:2.4, chroma:0.32, glow:0.20, tint:0.06, glassBlur:0,
                   scale:1, bubRadius:23, bubPadX:20, bubPadY:9, bubMaxW:72 };
let params = Object.assign({}, DEFAULTS);
try { const s = JSON.parse(localStorage.getItem('lg-params') || 'null'); if(s) params = Object.assign({}, DEFAULTS, s); } catch(e){}
const saveParams = () => { try { localStorage.setItem('lg-params', JSON.stringify(params)); } catch(e){} };

// 气泡颜色（AI 与胶囊同步；我的单独）
const DEFCOL = { ai: '#2a323d', user: '#d9e5f2' };
let colors = Object.assign({}, DEFCOL);
try { colors = Object.assign({}, DEFCOL, JSON.parse(localStorage.getItem('lg-colors') || '{}')); } catch(e){}
function hexToVec(h){
  h = (h || '#2a323d').replace('#',''); if(h.length === 3) h = h.split('').map(c => c+c).join('');
  const n = parseInt(h, 16); return [((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255];
}
let colAIv = hexToVec(colors.ai), colUserv = hexToVec(colors.user);
const colNeutralv = hexToVec('#2a323d');
const colorId = el => { const c = el.dataset.color; return c === 'ai' ? 0.0 : c === 'user' ? 1.0 : 2.0; };

function setBubbleVars(){
  const r = document.documentElement.style;
  r.setProperty('--bub-radius', params.bubRadius + 'px');
  r.setProperty('--bub-padx', params.bubPadX + 'px');
  r.setProperty('--bub-pady', params.bubPadY + 'px');
  r.setProperty('--bub-maxw', params.bubMaxW + '%');
  r.setProperty('--msg-font', (17 * params.scale).toFixed(1) + 'px');
  r.setProperty('--avatar-size', (34 * params.scale).toFixed(1) + 'px');
}
setBubbleVars();

function compile(t, src){ const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }

function initGL(){
  gl = canvas.getContext('webgl', { premultipliedAlpha:false, antialias:true });
  if(!gl) return false;
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
  const a = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
  ['uRes','uTex','uCount','uLight','uStrength','uEdge','uChroma','uGlow','uRimPow','uTint','uBlur','uColAI','uColUser','uColNeutral']
    .forEach(n => loc[n] = gl.getUniformLocation(prog, n));
  loc.uRect = gl.getUniformLocation(prog, 'uRect[0]');
  loc.uMeta = gl.getUniformLocation(prog, 'uMeta[0]');
  tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  return true;
}

let userImg = null;
function drawCover(x, img, w, h){
  const ir = img.width/img.height, cr = w/h; let dw, dh;
  if(ir > cr){ dh = h; dw = h*ir; } else { dw = w; dh = w/ir; }
  x.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
}
// 先把场景(壁纸或内置渐变)画到一张画布
function renderScene(w, h){
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  if(userImg){ drawCover(x, userImg, w, h); return c; }
  const grad = x.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'#4a5a68'); grad.addColorStop(0.42,'#202932'); grad.addColorStop(1,'#0c1116');
  x.fillStyle = grad; x.fillRect(0,0,w,h);
  [[0.20,0.08,0.9,'#8aa0b4'],[0.85,0.18,0.7,'#6f8698'],[0.40,0.55,0.5,'#cfd8e0'],
   [0.78,0.72,0.45,'#b6c2cc'],[0.12,0.80,0.42,'#9fb0bd'],[0.55,0.30,0.35,'#dfe7ee']]
  .forEach(([bx,by,rr,cl])=>{ const r = rr*Math.max(w,h)*0.5;
    const rg = x.createRadialGradient(bx*w,by*h,0,bx*w,by*h,r);
    rg.addColorStop(0,cl); rg.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle = rg; x.fillRect(0,0,w,h); });
  x.fillStyle = 'rgba(120,132,148,0.10)'; x.fillRect(0,0,w,h);
  return c;
}
function buildBackground(w, h){ return renderScene(w, h); }
// 设置面板配色跟随聊天背景（取背景平均色）
function computeTheme(){
  const s = document.createElement('canvas'); s.width = s.height = 24; const sx = s.getContext('2d');
  sx.drawImage(buildBackground(24, 24), 0, 0);
  const d = sx.getImageData(0,0,24,24).data; let r=0,g=0,b=0,c=0;
  for(let i=0;i<d.length;i+=4){ r+=d[i]; g+=d[i+1]; b+=d[i+2]; c++; }
  r/=c; g/=c; b/=c;
  const dk = v => Math.round(v*0.34 + 12);
  const ac = v => Math.min(255, Math.round(v*1.1 + 55));
  const rs = document.documentElement.style;
  rs.setProperty('--set-bg', `rgba(${dk(r)},${dk(g)},${dk(b)},0.88)`);
  rs.setProperty('--set-accent', `rgb(${ac(r)},${ac(g)},${ac(b)})`);
}
function updateTexture(){ if(!gl) return;
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, buildBackground(canvas.width, canvas.height));
  computeTheme();
}
function setWallpaper(dataURL, remember){
  const img = new Image();
  img.onload = () => { userImg = img; updateTexture();
    if(remember){ try { localStorage.setItem('lg-wallpaper', dataURL); } catch(e){} }
    if(!gl){ phone.style.background = 'center/cover no-repeat url(' + dataURL + ')'; } };
  img.src = dataURL;
}

function resize(){
  const w = Math.round(phone.clientWidth*dpr), h = Math.round(phone.clientHeight*dpr);
  if(canvas.width === w && canvas.height === h) return;
  canvas.width = w; canvas.height = h; gl.viewport(0,0,w,h);
  gl.uniform2f(loc.uRes, w, h);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, buildBackground(w, h));
  computeTheme();
}
function frame(){
  resize();
  const pr = phone.getBoundingClientRect();
  const els = phone.querySelectorAll('.glass');
  const rects = new Float32Array(MAX*4), metas = new Float32Array(MAX*2); let n = 0;
  els.forEach(el => {
    if(n >= MAX) return;
    const r = el.getBoundingClientRect(); if(r.width < 2 || r.height < 2) return;
    const cx = (r.left-pr.left + r.width/2)*dpr, cy = (r.top-pr.top + r.height/2)*dpr;
    const hw = r.width/2*dpr, hh = r.height/2*dpr;
    let rad = parseFloat(getComputedStyle(el).borderTopLeftRadius) || 20;
    rad = Math.min(rad*dpr, hw, hh);
    rects[n*4]=cx; rects[n*4+1]=cy; rects[n*4+2]=hw; rects[n*4+3]=hh;
    metas[n*2]=rad; metas[n*2+1] = colorId(el); n++;
  });
  gl.uniform1i(loc.uCount, n);
  gl.uniform4fv(loc.uRect, rects); gl.uniform2fv(loc.uMeta, metas);
  gl.uniform2f(loc.uLight, light[0], light[1]);
  gl.uniform1f(loc.uStrength, params.strength*dpr);
  gl.uniform1f(loc.uEdge, params.edge*dpr);
  gl.uniform1f(loc.uChroma, params.chroma);
  gl.uniform1f(loc.uGlow, params.glow);
  gl.uniform1f(loc.uRimPow, params.rimPow);
  gl.uniform1f(loc.uTint, params.tint);
  gl.uniform1f(loc.uBlur, params.glassBlur * dpr);
  gl.uniform3fv(loc.uColAI, colAIv);
  gl.uniform3fv(loc.uColUser, colUserv);
  gl.uniform3fv(loc.uColNeutral, colNeutralv);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(loc.uTex, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}

phone.addEventListener('pointermove', (e) => {
  const pr = phone.getBoundingClientRect();
  const nx = (e.clientX-pr.left)/pr.width - 0.5, ny = (e.clientY-pr.top)/pr.height - 0.5;
  const len = Math.hypot(nx,ny) || 1; light = [nx/len, ny/len];
});

/* ===== 抽屉 / 设置 ===== */
const menuOverlay = document.getElementById('menu-overlay');
const settingsOverlay = document.getElementById('settings-overlay');
document.getElementById('menu-btn').addEventListener('click', () => { menuOverlay.hidden = false; });
document.getElementById('open-settings').addEventListener('click', () => { menuOverlay.hidden = true; settingsOverlay.hidden = false; });
menuOverlay.addEventListener('click', (e) => { if(e.target === menuOverlay) menuOverlay.hidden = true; });
settingsOverlay.addEventListener('click', (e) => { if(e.target === settingsOverlay) settingsOverlay.hidden = true; });

/* ===== API 配置 / 设定 / 记忆 面板 ===== */
function openSheet(ov){ menuOverlay.hidden = true; ov.hidden = false; }
function bindClose(ov){ ov.addEventListener('click', e => { if(e.target === ov) ov.hidden = true; }); }
const apiOverlay = document.getElementById('api-overlay');
const personaOverlay = document.getElementById('persona-overlay');
const memoryOverlay = document.getElementById('memory-overlay');
[apiOverlay, personaOverlay, memoryOverlay].forEach(bindClose);
document.getElementById('open-api').addEventListener('click', () => openSheet(apiOverlay));
document.getElementById('open-persona').addEventListener('click', () => openSheet(personaOverlay));
document.getElementById('open-memory').addEventListener('click', () => openSheet(memoryOverlay));

// 存储：API / 人设 / 记忆
let apiCfg = { baseUrl:'', apiKey:'', model:'', temperature:0.8, maxTokens:'', ctx:40 };
let persona = '', memory = '';
try { apiCfg = Object.assign(apiCfg, JSON.parse(localStorage.getItem('lg-api') || '{}')); } catch(e){}
try { persona = localStorage.getItem('lg-persona') || ''; } catch(e){}
try { memory = localStorage.getItem('lg-memory') || ''; } catch(e){}
const SPLIT_TOKEN = '<split>';
let splitMode = false;
try { splitMode = localStorage.getItem('lg-split') === '1'; } catch(e){}

// ===== 多会话（聊天窗口）=====
const genId = () => 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const sessTitle = (h) => { const u = h.find(m => m.role === 'user'); return u ? u.content.slice(0,14) : '新对话'; };
let sessions = [], curId = null;
try { sessions = JSON.parse(localStorage.getItem('lg-sessions') || '[]') || []; } catch(e){}
try { curId = localStorage.getItem('lg-cur') || null; } catch(e){}
if(!sessions.length){
  let old = [];
  try { old = JSON.parse(localStorage.getItem('lg-history') || '[]') || []; } catch(e){}
  sessions = [{ id: genId(), title: sessTitle(old), history: old }];
}
if(!curId || !sessions.find(s => s.id === curId)) curId = sessions[0].id;
const curSession = () => sessions.find(s => s.id === curId) || sessions[0];
let history = curSession().history;
function persistSessions(){ try { localStorage.setItem('lg-sessions', JSON.stringify(sessions)); localStorage.setItem('lg-cur', curId); } catch(e){} }
const saveHistory = () => { if(history.length > 80) history.splice(0, history.length - 80); curSession().title = sessTitle(history); persistSessions(); renderWindows(); };

function renderMessages(){
  const el = document.getElementById('messages'); el.innerHTML = '';
  history.forEach(m => {
    if(m.role === 'user'){ addBubble('right', m.content); return; }
    const segs = String(m.content || '').split(SPLIT_TOKEN).map(s => s.trim()).filter(Boolean);
    const list = segs.length ? segs : [String(m.content || '')];
    let first = null;
    list.forEach((seg, i) => { const sp = addBubble('left', seg); if(i === 0) first = sp; });
    if(first && m.reasoning) attachReasoning(first, m.reasoning);
  });
}
function switchSession(id){ curId = id; history = curSession().history; persistSessions(); renderMessages(); renderWindows(); menuOverlay.hidden = true; }

// 组装系统提示：人设 + 记忆 + 分条风格
function buildSystem(){
  let s = (persona || '').trim();
  if(memory && memory.trim()) s += (s ? '\n\n' : '') + '【长期记忆】\n' + memory.trim();
  if(splitMode) s += (s ? '\n\n' : '') + '【消息风格】像真人聊天那样，把回复拆成 2~4 条简短的消息，一条一条发。每条消息之间只用 ' + SPLIT_TOKEN + ' 分隔，不要用横线、数字编号或其它分隔符。';
  return s || '你是一个温柔友好的聊天助手，用中文自然地回复。';
}
// 流式请求中转/官方 OpenAI 接口
// 只把真实对话(不含思维链)发回上下文；userContent 可为字符串或(含图片的)数组
async function streamAI(userContent, onDelta, onReason){
  const ctx = apiCfg.ctx || 40;
  const msgs = [{ role:'system', content: buildSystem() },
    ...history.slice(-ctx).map(m => ({ role: m.role, content: String(m.content).split(SPLIT_TOKEN).join('\n') })),
    { role:'user', content: userContent }];
  const payload = { model: apiCfg.model, messages: msgs, stream: true };
  if(apiCfg.temperature != null && !isNaN(apiCfg.temperature)) payload.temperature = apiCfg.temperature;
  const mt = parseInt(apiCfg.maxTokens); if(mt > 0) payload.max_tokens = mt;
  const res = await fetch(apiCfg.baseUrl.replace(/\/$/, '') + '/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiCfg.apiKey },
    body: JSON.stringify(payload)
  });
  if(!res.ok || !res.body) throw new Error('HTTP ' + res.status + ' ' + (await res.text().catch(()=> '')).slice(0, 160));
  const reader = res.body.getReader(); const dec = new TextDecoder();
  let buf = '', full = '', reason = '';
  while(true){
    const { value, done } = await reader.read(); if(done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while((idx = buf.indexOf('\n')) >= 0){
      const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
      if(!line.startsWith('data:')) continue;
      const data = line.slice(5).trim();
      if(data === '[DONE]') return { content: full, reasoning: reason };
      try {
        const j = JSON.parse(data);
        const d = j.choices && j.choices[0] && j.choices[0].delta;
        if(d){
          if(d.reasoning_content){ reason += d.reasoning_content; onReason && onReason(reason); }
          if(d.content){ full += d.content; onDelta(full); }
        }
      } catch(e){}
    }
  }
  return { content: full, reasoning: reason };
}

async function send(){
  const text = inputEl.value.trim();
  const images = pendingImages.slice();
  if((!text && images.length === 0) || typing) return;
  pendingImages = []; renderStrip();
  addUserMessage(text, images);
  inputEl.value = ''; inputEl.style.height = 'auto';
  typing = true; sendEl.disabled = true; showTyping();

  const configured = apiCfg.baseUrl && apiCfg.apiKey && apiCfg.model;
  if(configured){
    // 含图片时用数组内容（视觉模型可识别）
    const userContent = images.length
      ? [ ...(text ? [{ type:'text', text }] : []), ...images.map(u => ({ type:'image_url', image_url:{ url:u } })) ]
      : text;
    history.push({ role:'user', content: text || '[图片]' });

    const bubbles = [];
    const put = (i, t) => {
      if(!bubbles[i]){ if(t === '') return; if(i === 0) hideTyping(); bubbles[i] = addBubble('left', ''); }
      if(bubbles[i]){ bubbles[i].textContent = t; realign(bubbles[i]); }
    };
    const onDelta = splitMode
      ? (full) => { full.split(SPLIT_TOKEN).forEach((seg, i) => put(i, seg.trim())); scrollDown(); }
      : (full) => { put(0, full); scrollDown(); };

    try {
      const { content, reasoning } = await streamAI(userContent, onDelta);
      hideTyping();
      const segs = splitMode ? content.split(SPLIT_TOKEN).map(s => s.trim()).filter(Boolean) : [content.trim()];
      if(segs.length === 0) segs.push('（空回复）');
      segs.forEach((seg, i) => put(i, seg));
      for(let i = segs.length; i < bubbles.length; i++) bubbles[i]?.closest('.row')?.remove();
      bubbles.length = segs.length;
      if(bubbles[0]) attachReasoning(bubbles[0], reasoning);
      history.push({ role:'assistant', content: splitMode ? segs.join(SPLIT_TOKEN) : content, reasoning });
      saveHistory();
    } catch(err){
      hideTyping();
      bubbles.forEach(b => b.closest('.row')?.remove());
      addBubble('left', '⚠️ ' + err.message);
      history.pop();
    }
  } else {
    await new Promise(r => setTimeout(r, 700 + Math.random()*700));
    hideTyping();
    if(splitMode){ ['收到～', '这是分条发送的效果😋', '接了 API 就是真的一条条回啦'].forEach(t => addBubble('left', t)); }
    else addBubble('left', FAKE_REPLIES[Math.floor(Math.random()*FAKE_REPLIES.length)]);
  }
  typing = false; sendEl.disabled = false; inputEl.focus();
}
sendEl.addEventListener('click', send);
