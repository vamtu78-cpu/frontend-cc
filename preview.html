<title>液态玻璃聊天</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* 统一用 100vh，避免 iOS PWA 底部白边（不要混用 100% / 100dvh / fixed body）*/
  html, body { height: 100vh; margin: 0; }
  body {
    font-family: var(--app-font);
    background: #0b1016;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  :root {
    --app-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Inter", system-ui, sans-serif;
    --bub-radius: 23px; --bub-padx: 20px; --bub-pady: 9px; --bub-maxw: 72%;
    --msg-font: 17px; --avatar-size: 34px;
    --set-bg: rgba(22,28,36,0.86); --set-accent: #8fa2c9;
  }

  .phone {
    position: relative; isolation: isolate;
    width: 100%; max-width: 402px;
    height: 100vh;              /* 真机铺满整屏，消除底部白边 */
    overflow: hidden; color: #fff;
    display: flex; flex-direction: column;
    background: #12181f;
  }
  /* 只有宽屏（电脑预览）才把它做成"手机框"，限高 + 圆角 */
  @media (min-width: 440px) {
    .phone { height: 874px; max-height: 92vh; border-radius: 44px; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.8); }
  }

  #gl { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }

  /* 顶部渐变模糊遮罩：内容上滑时从顶部虚化露出 */
  .top-fade {
    position: absolute; top: 0; left: 0; right: 0; z-index: 3; pointer-events: none;
    height: calc(env(safe-area-inset-top) + 104px);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    /* 纯线性渐变，去掉硬块边 */
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 100%);
    mask-image: linear-gradient(to bottom, #000 0%, transparent 100%);
  }

  /* ===== 顶栏 ===== */
  .topbar {
    position: relative; z-index: 4;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    /* 顶部叠加安全区，避开灵动岛/状态栏 */
    padding: calc(4px + env(safe-area-inset-top)) 16px 10px;
  }
  .glass {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: 0 6px 20px rgba(0,0,0,0.20);
  }
  .glass-circle {
    width: 46px; height: 46px; flex-shrink: 0; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; cursor: pointer; padding: 0;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .glass-circle svg { width: 22px; height: 22px; }

  .name-capsule {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 5px 18px 5px 5px; border-radius: 999px; max-width: 62%;
  }
  .cap-avatar {
    width: 34px; height: 34px; flex-shrink: 0; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, #7c8ce0, #cf6bd6);
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.4); overflow: hidden;
  }
  .cap-avatar img, .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 999px; }
  .cap-name { font-size: 16px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.3); white-space: nowrap; }
  .topbar-spacer { width: 46px; flex-shrink: 0; }

  /* ===== 消息 ===== */
  /* 消息视口：不用原生滚动(见 JS「自绘滚动」)，由 transform 驱动，和 WebGL 玻璃同帧更新 */
  .msg-viewport {
    position: relative; z-index: 2;
    flex: 1; min-height: 0; overflow: hidden;
    touch-action: none; overscroll-behavior: none;
    /* 顶部/底部渐隐：滚动时消息在两端平滑淡出，而不是被"一刀切" */
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 34px, #000 calc(100% - 20px), transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 34px, #000 calc(100% - 20px), transparent 100%);
  }
  .messages {
    padding: 8px 14px 6px;
    display: flex; flex-direction: column; gap: 14px;
    will-change: transform;
  }

  .row { display: flex; align-items: center; gap: 8px; animation: fadeUp 0.3s ease-out; }
  .row.right { justify-content: flex-end; }
  .row.multiline { align-items: flex-start; }

  .avatar {
    width: var(--avatar-size); height: var(--avatar-size); flex-shrink: 0; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--avatar-size) * 0.47); font-weight: 600; color: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,0.3), inset 0 1px 2px rgba(255,255,255,0.35);
    overflow: hidden;
  }
  .avatar-ai   { background: linear-gradient(135deg, #7c8ce0, #cf6bd6); }
  .avatar-user { background: linear-gradient(135deg, #56b6f4, #3b7bf0); }

  .message {
    position: relative;
    display: inline-flex; align-items: center;
    max-width: var(--bub-maxw);
    padding: var(--bub-pady) var(--bub-padx);
    border-radius: var(--bub-radius);
    font-size: var(--msg-font); line-height: 1.4;
  }
  /* 气泡的玻璃边完全交给着色器的方向性边缘，去掉 CSS 那圈均匀白描边 */
  .message.glass { border: none; box-shadow: none; }
  .message span {
    position: relative; z-index: 2;
    white-space: pre-wrap; word-break: break-word;
    color: rgba(255,255,255,0.96);
    text-shadow: 0 1px 2px rgba(0,0,0,0.30);
  }

  .message span strong { font-weight: 700; }
  .message span em { font-style: italic; }
  .message span del { opacity: 0.6; }
  .message span a { color: #cfe0ff; text-decoration: underline; }
  .message span code {
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.88em; padding: 1px 5px; border-radius: 6px;
    background: rgba(255,255,255,0.16);
  }
  .message span pre {
    margin: 4px 0 0; padding: 8px 10px; border-radius: 10px;
    background: rgba(0,0,0,0.28); overflow-x: auto; white-space: pre;
  }
  .message span pre code { background: none; padding: 0; font-size: 0.86em; }

  .typing { display: flex; gap: 5px; }
  .typing i {
    width: 8px; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.9);
    animation: bounceDot 1.2s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: 0.2s; }
  .typing i:nth-child(3) { animation-delay: 0.4s; }

  /* ===== 输入栏 ===== */
  .composer { position: relative; z-index: 2; padding: 10px 14px calc(2px + env(safe-area-inset-bottom)); }
  .attach-strip { display: flex; gap: 8px; padding: 0 4px 8px; overflow-x: auto; }
  .attach-strip::-webkit-scrollbar { height: 0; }
  .attach-thumb { position: relative; width: 56px; height: 56px; flex-shrink: 0; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.25); }
  .attach-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .attach-thumb button { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 999px; background: rgba(0,0,0,0.6); color: #fff; border: none; font-size: 11px; line-height: 1; cursor: pointer; padding: 0; }
  /* + 展开功能面板（微信风） */
  .fn-panel {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    padding: 16px 14px; margin-top: 8px; border-radius: 20px;
    background: rgba(24,30,38,0.72);
    border: 1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%);
    animation: sheetUp 0.24s cubic-bezier(0.2,0.8,0.2,1);
  }
  .fn-panel[hidden] { display: none; }
  .fn-tile {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    background: transparent; border: none; color: rgba(255,255,255,0.85); font-size: 12px; cursor: pointer; padding: 0;
  }
  .fn-ic {
    width: 54px; height: 54px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.14);
  }
  .fn-ic svg { width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  /* 表情包面板 */
  .sticker-panel {
    padding: 12px; margin-top: 8px; border-radius: 20px;
    background: rgba(24,30,38,0.72);
    border: 1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%);
    animation: sheetUp 0.24s cubic-bezier(0.2,0.8,0.2,1);
  }
  .sticker-panel[hidden] { display: none; }
  .sticker-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    max-height: 180px; overflow-y: auto; margin-bottom: 10px;
  }
  .sticker-grid::-webkit-scrollbar { width: 0; }
  .sticker-item { position: relative; aspect-ratio: 1; cursor: pointer; }
  .sticker-item img { width: 100%; height: 100%; object-fit: contain; border-radius: 10px; background: rgba(255,255,255,0.06); }
  .sticker-item .sd { position: absolute; top: -4px; right: -4px; width: 18px; height: 18px; border-radius: 999px; background: rgba(0,0,0,0.7); color: #fff; border: none; font-size: 11px; line-height: 1; cursor: pointer; padding: 0; }
  .sticker-empty { grid-column: 1 / -1; text-align: center; color: rgba(255,255,255,0.5); font-size: 12px; padding: 16px 0; }
  .sticker-add { display: flex; gap: 8px; }
  .sticker-add input { flex: 1; min-width: 0; background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.18); border-radius: 999px; padding: 8px 12px; font-size: 13px; outline: none; }
  .sticker-add .btn.small { flex-shrink: 0; }

  /* 消息里的表情包：无气泡、透明底 */
  .msg-sticker { display: block; max-width: 128px; max-height: 128px; border-radius: 12px; cursor: pointer; }

  /* 文件卡片 */
  .msg-file { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,0.1); margin-bottom: 6px; max-width: 220px; }
  .msg-file svg { width: 22px; height: 22px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.7; }
  .msg-file span { font-size: 13px; word-break: break-all; }
  .attach-file { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18); color: #fff; font-size: 12px; flex-shrink: 0; }
  .attach-file button { background: transparent; border: none; color: rgba(255,255,255,0.6); cursor: pointer; font-size: 12px; padding: 0; }

  /* 消息里的图：方形小图，点开看全图；文字在下 */
  .message.media { flex-direction: column; align-items: stretch; }
  .msg-img { display: block; width: 150px; height: 150px; object-fit: cover; border-radius: 14px; margin-bottom: 6px; cursor: pointer; }
  /* 多图：田字/网格小方块 */
  .img-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; width: 200px; margin-bottom: 6px; }
  .grid-img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 10px; cursor: pointer; display: block; }
  .message.media span { margin-top: 2px; }
  /* 全图预览 */
  .lightbox { position: absolute; inset: 0; z-index: 30; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .lightbox[hidden] { display: none; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; }
  .inputbar { display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 10px; border-radius: 999px; }
  .icon-btn, .send {
    flex-shrink: 0; border-radius: 999px; color: #fff; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid rgba(255,255,255,0.22);
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .icon-btn { width: 40px; height: 40px; font-size: 22px; }
  .send { width: 46px; height: 46px; transition: transform 0.1s; }
  .send:active { transform: scale(0.92); }
  .send svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }
  textarea {
    flex: 1; resize: none; border: none; outline: none; background: transparent;
    color: #fff; font-family: inherit; font-size: 16px; line-height: 1.4;
    padding: 8px 4px; max-height: 110px; text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  textarea::placeholder { color: rgba(255,255,255,0.6); }

  /* ===== 功能抽屉 ===== */
  .overlay { position: absolute; inset: 0; z-index: 10; display: flex; }
  .overlay[hidden] { display: none; }
  #menu-overlay {
    justify-content: flex-start;
    background: rgba(8,12,18,0.35);
    backdrop-filter: blur(18px) saturate(120%); -webkit-backdrop-filter: blur(18px) saturate(120%);
  }
  .drawer {
    width: 264px; height: 100%; padding: 26px 16px;
    background: var(--set-bg);
    border-right: 1px solid rgba(255,255,255,0.14);
    box-shadow: 20px 0 60px -20px rgba(0,0,0,0.7);
    animation: slideIn 0.25s cubic-bezier(0.2,0.8,0.2,1);
    display: flex; flex-direction: column;
  }
  .drawer-title { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin: 6px 8px 14px; }
  .menu-item {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: 16px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    color: #fff; font-size: 15px; cursor: pointer; text-align: left;
  }
  .menu-item:hover { background: rgba(255,255,255,0.12); }
  .mi-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
  .mi-icon svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; }

  /* 聊天窗口列表 */
  #window-list { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .win-item {
    display: flex; align-items: center; gap: 6px; padding: 9px 12px; border-radius: 12px;
    background: rgba(255,255,255,0.04); border: 1px solid transparent; cursor: pointer;
  }
  .win-item.active { background: color-mix(in srgb, var(--set-accent) 28%, transparent); border-color: rgba(255,255,255,0.18); }
  .win-title { flex: 1; font-size: 13px; color: rgba(255,255,255,0.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .win-del {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 999px; padding: 0;
    background: transparent; border: none; color: rgba(255,255,255,0.5); font-size: 13px; cursor: pointer;
  }
  .win-del:hover { color: #ff9a9a; }

  /* ===== 设置：底部弹出面板（上方露出真实聊天=实时预览）===== */
  #settings-overlay, .overlay.bottom { align-items: flex-end; background: transparent; }
  /* 面板里的文字输入 */
  .fld { display: block; font-size: 12px; color: rgba(255,255,255,0.82); margin-bottom: 14px; }
  .fld input, .fld textarea {
    display: block; width: 100%; margin-top: 7px;
    background: rgba(255,255,255,0.08); color: #fff;
    border: 1px solid rgba(255,255,255,0.18); border-radius: 12px;
    padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none;
    -webkit-appearance: none;
  }
  .fld textarea { resize: vertical; line-height: 1.5; }
  .fld input:focus, .fld textarea:focus { border-color: var(--set-accent); }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(255,255,255,0.85); margin: 2px 0 14px; cursor: pointer; }
  .chk input { width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--set-accent); }

  /* 颜色选择行 */
  .color-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; font-size: 13px; color: rgba(255,255,255,0.85); }
  .color-row input[type=color] {
    width: 42px; height: 30px; flex-shrink: 0; padding: 0; border: 1px solid rgba(255,255,255,0.25);
    border-radius: 9px; background: transparent; cursor: pointer;
  }
  .color-row input[type=color]::-webkit-color-swatch-wrapper { padding: 3px; }
  .color-row input[type=color]::-webkit-color-swatch { border: none; border-radius: 6px; }

  /* 面板毛玻璃 */
  .sheet { backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%); }

  /* 思维链弹窗：固定大尺寸，不随内容缩放 */
  .think-sheet {
    height: 78%; max-height: 78%; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .think-title { text-align: center; font-weight: 800; margin: 4px 0 0; }
  .think-body {
    flex: 1; margin-top: 22px;                 /* 与标题空约一行 */
    font-size: 14px; line-height: 1.7; color: rgba(255,255,255,0.82);
    white-space: pre-wrap; word-break: break-word;
    overflow-y: auto; padding-bottom: 6px;
  }
  .think-body::-webkit-scrollbar { width: 0; }
  /* 有思考过程的 AI 头像：可点 + 右上角 ✦ 标记(头像外) */
  .avatar.has-think { cursor: pointer; position: relative; overflow: visible; }
  .avatar.has-think::after {
    content: '✦'; position: absolute; top: -7px; right: -7px;
    font-size: 13px; line-height: 1; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6); pointer-events: none;
  }
  .sheet {
    width: 100%; max-height: 70%; overflow-y: auto;
    padding: 10px 20px 22px; border-radius: 26px 26px 0 0;
    background: var(--set-bg);
    border-top: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 -20px 60px -14px rgba(0,0,0,0.7);
    animation: sheetUp 0.26s cubic-bezier(0.2,0.8,0.2,1);
  }
  .sheet::-webkit-scrollbar { width: 0; }
  .grab { width: 40px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.3); margin: 2px auto 12px; }
  .sheet-title { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
  .sheet-hint { font-size: 12px; color: rgba(255,255,255,0.5); margin: 0 0 16px; }
  .sec { margin-bottom: 20px; }
  .sec-head {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; letter-spacing: 0.05em; color: rgba(255,255,255,0.55);
    text-transform: uppercase; margin-bottom: 10px;
  }
  .btn-row { display: flex; gap: 10px; }
  .btn {
    color: #fff; cursor: pointer; font-size: 14px;
    background: color-mix(in srgb, var(--set-accent) 32%, transparent);
    border: 1px solid rgba(255,255,255,0.22); border-radius: 999px; padding: 9px 16px;
  }
  .btn.small { font-size: 12px; padding: 4px 12px; }
  .btn.flex { flex: 1; text-align: center; }
  .sheet label { display: block; font-size: 12px; color: rgba(255,255,255,0.82); margin-bottom: 12px; }
  .sheet output { float: right; font-variant-numeric: tabular-nums; color: #fff; font-weight: 600; }
  .sheet input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 4px;
    margin-top: 9px; border-radius: 999px; background: rgba(255,255,255,0.22); outline: none;
  }
  .sheet input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 999px;
    background: var(--set-accent); cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .sheet input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px; border: none; border-radius: 999px; background: var(--set-accent); cursor: pointer;
  }

  /* ===== 开屏 ===== */
  .splash { position: absolute; inset: 0; z-index: 20; touch-action: none; background: #030306; }
  .splash canvas { width: 100%; height: 100%; display: block; }
  .splash-hint {
    position: absolute; left: 0; right: 0; bottom: calc(46px + env(safe-area-inset-bottom));
    text-align: center; font-size: 13px; letter-spacing: 0.32em; color: rgba(255,255,255,0.6);
    pointer-events: none; transition: opacity 0.5s; animation: hintPulse 2.6s ease-in-out infinite;
  }
  .splash-hint.gone { opacity: 0; animation: none; }
  @keyframes hintPulse { 0%,100% { opacity: 0.35; } 50% { opacity: 0.8; } }
  .booting .cap-avatar, .booting .cap-name { opacity: 0; }
  .glass.gl-off { border-color: transparent; box-shadow: none; }
  .row.gl-off { visibility: hidden; }
  .booting .composer, .booting #menu-btn { opacity: 0; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes bounceDot { 0%,80%,100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-4px); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .row, .typing i, .drawer, .sheet { animation: none; } }
</style>

<div class="phone" id="phone">
  <canvas id="gl"></canvas>
  <div class="top-fade"></div>

  <div class="topbar">
    <button class="glass glass-circle" id="menu-btn" aria-label="菜单" data-side="left" data-color="neutral">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="glass name-capsule" id="name-capsule" data-side="left" data-color="ai">
      <span class="cap-avatar" id="cap-avatar"></span>
      <span class="cap-name" id="cap-name">言</span>
    </div>
    <span class="topbar-spacer"></span>
  </div>

  <div class="msg-viewport" id="msg-viewport"><div class="messages" id="messages"></div></div>

  <div class="composer">
    <div class="attach-strip" id="attach-strip" hidden></div>
    <div class="glass inputbar" data-side="left" data-color="neutral">
      <button class="icon-btn" id="plus-btn" aria-label="更多">＋</button>
      <textarea id="input" rows="1" placeholder="Type a message..."></textarea>
      <button class="send" id="send" aria-label="发送">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>

    <!-- + 展开功能面板（在输入框下面，从下往上弹）-->
    <div class="fn-panel" id="plus-panel" hidden>
      <button class="fn-tile" id="fn-photo">
        <span class="fn-ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 17l4.5-4.5 4 4L16 12l4 5"/></svg></span>图片
      </button>
      <button class="fn-tile" id="fn-file">
        <span class="fn-ic"><svg viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg></span>文件
      </button>
      <button class="fn-tile" id="fn-sticker">
        <span class="fn-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="10" r="1"/><path d="M8.5 14.5a4 4 0 0 0 7 0"/></svg></span>表情包
      </button>
    </div>

    <!-- 表情包面板（同样在输入框下面）-->
    <div class="sticker-panel" id="sticker-panel" hidden>
      <div class="sticker-grid" id="sticker-grid"></div>
      <div class="sticker-add">
        <input type="text" id="sticker-url" placeholder="粘贴图片 URL 添加表情" autocapitalize="off" autocomplete="off" spellcheck="false">
        <button class="btn small" id="sticker-url-add">添加</button>
        <button class="btn small" id="sticker-upload">上传</button>
      </div>
    </div>
  </div>

  <!-- 功能抽屉 -->
  <div class="overlay" id="menu-overlay" hidden>
    <div class="drawer" id="drawer">
      <div class="drawer-title">聊天窗口</div>
      <button class="menu-item" id="new-chat">
        <span class="mi-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
        <span>新建对话</span>
      </button>
      <div id="window-list"></div>

      <div class="drawer-title" style="margin-top:18px">功能</div>
      <button class="menu-item" id="open-settings">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </span>
        <span>设置</span>
      </button>
      <button class="menu-item" id="open-api">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18" cy="17" r="2.4"/></svg>
        </span>
        <span>API 配置</span>
      </button>
      <button class="menu-item" id="open-persona">

          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        </span>
        <span>设定（人设）</span>
      </button>
      <button class="menu-item" id="open-memory">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24"><path d="M12 3a4 4 0 0 0-4 4v1a3 3 0 0 0 0 6 3 3 0 0 0 4 3 3 3 0 0 0 4-3 3 3 0 0 0 0-6V7a4 4 0 0 0-4-4z"/><path d="M12 3v18"/></svg>
        </span>
        <span>记忆</span>
      </button>
    </div>
  </div>

  <div class="overlay bottom" id="api-overlay" hidden>
    <div class="sheet">
      <div class="grab"></div>
      <div class="sheet-title">API 配置</div>
      <p class="sheet-hint">支持 OpenAI 格式的中转/官方接口，密钥仅存在本机浏览器</p>
      <label class="fld">接口地址 (Base URL)
        <input type="text" id="api-base" placeholder="https://你的中转/v1" autocapitalize="off" autocomplete="off" spellcheck="false">
      </label>
      <label class="fld">API Key
        <input type="password" id="api-key" placeholder="sk-..." autocapitalize="off" autocomplete="off" spellcheck="false">
      </label>
      <label class="fld">模型
        <input type="text" id="api-model" placeholder="gpt-4o-mini / claude-3-5-sonnet ..." autocapitalize="off" autocomplete="off" spellcheck="false">
      </label>
      <label class="fld">温度（创意度）<output id="api-temp-v"></output>
        <input type="range" id="api-temp" min="0" max="2" step="0.05">
      </label>
      <label class="fld">上下文条数（带几条历史）<output id="api-ctx-v"></output>
        <input type="range" id="api-ctx" min="2" max="60" step="1">
      </label>
      <label class="fld">最大回复长度（留空 = 不限）
        <input type="text" id="api-maxtok" inputmode="numeric" placeholder="如 2048" autocomplete="off">

    </div>
  </div>

    <div class="sheet">
      <div class="grab"></div>
      <div class="sheet-title">设定</div>
      <p class="sheet-hint">给 AI 的人设 / 系统提示，会作为对话的开场设定</p>
      <label class="fld">昵称
        <input type="text" id="persona-name" placeholder="言">
      </label>
      <label class="fld">人设内容
        <textarea id="persona-text" rows="7" placeholder="例如：你是我的老公，说话温柔、爱撒娇，会用中文回复我……"></textarea>

      <label class="chk"><input type="checkbox" id="split-toggle"> 像真人一样分条发送（把回复拆成多条短消息）</label>
      <button class="btn flex" id="persona-save" style="width:100%">保存</button>
    </div>
  </div>

  <!-- 记忆 -->

    <div class="sheet">
      <div class="grab"></div>
      <div class="sheet-title">记忆</div>

          <button class="btn flex" id="font-reset">恢复默认</button>

        <label>透明度 <output id="v-trans"></output><input type="range" id="r-trans" min="0" max="1" step="0.01"></label>
        <label>自适应对比 <output id="v-contrast"></output><input type="range" id="r-contrast" min="0" max="1.5" step="0.01"></label>
        <label>阴影分离 <output id="v-shadow"></output><input type="range" id="r-shadow" min="0" max="1" step="0.01"></label>
        <label>体积光 <output id="v-vol"></output><input type="range" id="r-vol" min="0" max="0.5" step="0.01"></label>
        <label>迎光边缘 <output id="v-glow"></output><input type="range" id="r-glow" min="0" max="0.9" step="0.01"></label>

  <!-- 全图预览 -->
  <div class="lightbox" id="img-lightbox" hidden><img id="lightbox-img" src="" alt=""></div>
</div>

<script>
/* ===== 昵称 / 头像 ===== */
let nickname = '言';
try { nickname = localStorage.getItem('lg-nick') || '言'; } catch(e){}
let AI_TEXT = nickname.slice(0, 1) || '言';
const USER_TEXT = '🧑';
let aiAvatarSrc = null, userAvatarSrc = null;
try { aiAvatarSrc = localStorage.getItem('lg-ai-avatar') || null; userAvatarSrc = localStorage.getItem('lg-user-avatar') || null; } catch(e){}

document.getElementById('cap-name').textContent = nickname;
function avatarHTML(side){
  const src = side === 'right' ? userAvatarSrc : aiAvatarSrc;
  if(src) return '<img src="' + src + '" alt="">';
  return side === 'right' ? USER_TEXT : AI_TEXT;
}
function applyAvatars(){
  const cap = document.getElementById('cap-avatar');
  cap.innerHTML = avatarHTML('left');
  document.querySelectorAll('.avatar-ai').forEach(a => a.innerHTML = avatarHTML('left'));
  document.querySelectorAll('.avatar-user').forEach(a => a.innerHTML = avatarHTML('right'));
}
function setAvatar(side, dataURL){
  if(side === 'right'){ userAvatarSrc = dataURL; try { localStorage.setItem('lg-user-avatar', dataURL); } catch(e){} }
  else { aiAvatarSrc = dataURL; try { localStorage.setItem('lg-ai-avatar', dataURL); } catch(e){} }
  applyAvatars();
}

/* ===== 液态玻璃 WebGL ===== */
const MAX = 48;
const VERT = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.0,1.0); }`;
const FRAG = `
precision highp float;
uniform vec2 uRes; uniform sampler2D uTex; uniform int uCount;
uniform vec4 uRect[${MAX}]; uniform vec2 uMeta[${MAX}];
uniform vec2 uLight;
uniform vec4 uFade;   // 消息区渐隐带(px)：上沿起/止、下沿起/止，和 .msg-viewport 的 mask 一致
uniform float uStrength, uEdge, uChroma, uGlow, uRimPow, uTint, uBlur, uBlurN, uTrans, uVol, uContrast, uShadow;
uniform vec3 uColAI, uColUser, uColNeutral;
float sdRound(vec2 p, vec2 c, vec2 hw, float r){
  vec2 q = abs(p-c) - hw + r;
  return min(max(q.x,q.y),0.0) + length(max(q,0.0)) - r;
}
float scene(vec2 p, out float side, out vec4 rct, out float rad){
  float d = 1e9; side = 0.0; rct = vec4(0.0); rad = 0.0;
  for(int i=0;i<${MAX};i++){ if(i>=uCount) break;
    vec4 R = uRect[i];
    float di = sdRound(p, R.xy, R.zw, uMeta[i].x);
    if(di < d){ d = di; side = uMeta[i].y; rct = R; rad = uMeta[i].x; } }
  return d;
}
float sceneD(vec2 p){ float s; vec4 rr; float rd; return scene(p,s,rr,rd); }
vec3 bg(vec2 p){ return texture2D(uTex, vec2(p.x/uRes.x, p.y/uRes.y)).rgb; }
// 磨砂散射：单环 9 点轻采样(与 liquid-glass-lab 一致)，保持折射清脆不糊成一片
vec3 bgB(vec2 p, float rad){
  vec3 s = bg(p);
  if(rad > 0.5){
    s += bg(p+vec2(rad,0.0)) + bg(p+vec2(-rad,0.0)) + bg(p+vec2(0.0,rad)) + bg(p+vec2(0.0,-rad));
    float r2 = rad * 0.7071;
    s += bg(p+vec2(r2,r2)) + bg(p+vec2(-r2,r2)) + bg(p+vec2(r2,-r2)) + bg(p+vec2(-r2,-r2));
    s /= 9.0;
  }
  return s;
}
void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  float side; vec4 rct; float rad; float d = scene(p, side, rct, rad);
  // side ≥ 4 表示消息区里的气泡：跟文字一起在视口两端渐隐，不然文字淡了、玻璃空壳还在
  float fade = 1.0;
  if(side > 3.5){ side -= 4.0;
    fade = clamp((p.y - uFade.x) / max(uFade.y - uFade.x, 1.0), 0.0, 1.0) * clamp((uFade.w - p.y) / max(uFade.w - uFade.z, 1.0), 0.0, 1.0); }
  vec3 col = bg(p);
  // 阴影 / separation：形状外、向右下偏移一圈柔和暗部(光来自左上)，给玻璃"托起"的分离感
  if(d > 0.0 && uShadow > 0.001){
    float dS = sdRound(p - vec2(5.0, 8.0), rct.xy, rct.zw, rad);
    float shadow = uShadow * smoothstep(20.0, 0.0, dS) * smoothstep(-1.0, 6.0, d) * fade;
    col = mix(col, col * 0.55, shadow * 0.6);
  }
  float alpha = smoothstep(1.6, -1.6, d) * fade;
  if(alpha > 0.001){
    float e = 1.5;
    vec2 g = normalize(vec2(sceneD(p+vec2(e,0.))-sceneD(p-vec2(e,0.)),
                            sceneD(p+vec2(0.,e))-sceneD(p-vec2(0.,e))) + 1e-6);
    float dIn = -d;                                  // 形状内部为正
    vec2 hf = max(rct.zw, vec2(1.0));
    vec2 lp = (p - rct.xy) / hf;                      // 气泡内归一化坐标 [-1,1]
    vec2 Ldir = normalize(vec2(-0.55, -0.83));        // 光来自左上

    // ① 透镜折射：uEdge 是固定物理厚度(px)，材质随气泡大小自然变化(与 lab 一致，无额外衰减)
    float t = clamp(dIn / max(uEdge, 1.0), 0.0, 1.0);
    float lens = pow(1.0 - t, uRimPow);
    vec2 off = g * uStrength * lens;
    // ② 磨砂：气泡用 uBlur(可低至 0，保持清脆)，输入框/顶栏(neutral)高一点保证可读
    float blur = (side > 1.5) ? uBlurN : uBlur;
    blur *= (1.0 + lens * 0.6);
    vec3 refr;
    refr.r = bgB(p + off*(1.0+uChroma), blur).r;
    refr.g = bgB(p + off, blur).g;
    refr.b = bgB(p + off*(1.0-uChroma), blur).b;

    // ③ 透明度：uTrans 越高越只剩折射(玻璃感)，越低越乳白。UI 层(neutral)封顶以保证文字可读
    float tr = (side > 1.5) ? min(uTrans, 0.82) : uTrans;
    vec3 milk = vec3(0.86, 0.89, 0.95);
    vec3 glass = mix(milk, refr, clamp(tr, 0.0, 1.0));
    // 颜色染色(跟随气泡配色)叠一层薄的
    vec3 tint = uColNeutral;
    if(side < 0.5) tint = uColAI;
    else if(side < 1.5) tint = uColUser;
    glass = mix(glass, tint, uTint);
    // ③b 自适应对比(Regular 变体思路)：按底层亮度反向微调，暗背景更亮/亮背景更沉，保可读
    float Lb = dot(refr, vec3(0.299, 0.587, 0.114));
    vec3 adapt = Lb > 0.5 ? vec3(0.05, 0.06, 0.08) : vec3(0.97, 0.98, 1.0);
    glass = mix(glass, adapt, clamp(uContrast, 0.0, 1.5) * 0.20);

    // ④ 内部体积光：左上方一团柔和高光(像光透进玻璃体)，绝非发光描边
    vec2 hp = lp - vec2(-0.42, -0.5);
    float vol = exp(-dot(hp, hp) * 1.5) * smoothstep(0.0, 7.0, dIn);
    glass += vec3(1.0) * vol * uVol;

    // ⑤ 方向性边缘：迎光侧(左上)细亮边，背光侧(右下)内暗边 → 有厚度、不是均匀白圈
    float rimHi = pow(1.0 - smoothstep(0.0, 5.0, dIn), 1.7);
    float ndl = dot(g, Ldir);                         // >0 迎光, <0 背光
    glass += vec3(1.0) * rimHi * max(ndl, 0.0) * uGlow;     // 迎光亮边

    float spec = pow(max(ndl, 0.0), 22.0) * rimHi;

    col = mix(col, glass, alpha);

function compile(t, src){ const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }

function initGL(){

  if(!gl) return false;
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));

  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
  const a = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
  ['uRes','uTex','uCount','uLight','uFade','uStrength','uEdge','uChroma','uGlow','uRimPow','uTint','uBlur','uBlurN','uTrans','uVol','uContrast','uShadow','uColAI','uColUser','uColNeutral']

  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

}

let userImg = null;
function drawCover(x, img, w, h){
  const ir = img.width/img.height, cr = w/h; let dw, dh;
  if(ir > cr){ dh = h; dw = h*ir; } else { dw = w; dh = w/ir; }
  x.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
}
// 先把场景(壁纸或内置渐变)画到一张画布
function renderScene(w, h){
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  if(userImg){ drawCover(x, userImg, w, h); return c; }
  const grad = x.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'#4a5a68'); grad.addColorStop(0.42,'#202932'); grad.addColorStop(1,'#0c1116');
  x.fillStyle = grad; x.fillRect(0,0,w,h);
  [[0.20,0.08,0.9,'#8aa0b4'],[0.85,0.18,0.7,'#6f8698'],[0.40,0.55,0.5,'#cfd8e0'],
   [0.78,0.72,0.45,'#b6c2cc'],[0.12,0.80,0.42,'#9fb0bd'],[0.55,0.30,0.35,'#dfe7ee']]
  .forEach(([bx,by,rr,cl])=>{ const r = rr*Math.max(w,h)*0.5;
    const rg = x.createRadialGradient(bx*w,by*h,0,bx*w,by*h,r);
    rg.addColorStop(0,cl); rg.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle = rg; x.fillRect(0,0,w,h); });
  x.fillStyle = 'rgba(120,132,148,0.10)'; x.fillRect(0,0,w,h);
  return c;
}
function buildBackground(w, h){ return renderScene(w, h); }
// 设置面板配色跟随聊天背景（取背景平均色）
function computeTheme(){
  const s = document.createElement('canvas'); s.width = s.height = 24; const sx = s.getContext('2d');
  sx.drawImage(buildBackground(24, 24), 0, 0);
  const d = sx.getImageData(0,0,24,24).data; let r=0,g=0,b=0,c=0;
  for(let i=0;i<d.length;i+=4){ r+=d[i]; g+=d[i+1]; b+=d[i+2]; c++; }
  r/=c; g/=c; b/=c;
  const dk = v => Math.round(v*0.34 + 12);
  const ac = v => Math.min(255, Math.round(v*1.1 + 55));
  const rs = document.documentElement.style;
  rs.setProperty('--set-bg', `rgba(${dk(r)},${dk(g)},${dk(b)},0.88)`);
  rs.setProperty('--set-accent', `rgb(${ac(r)},${ac(g)},${ac(b)})`);
}
function updateTexture(){ if(!gl) return;
  gl.bindTexture(gl.TEXTURE_2D, tex);

function resize(){

  if(canvas.width === w && canvas.height === h) return;
  canvas.width = w; canvas.height = h; gl.viewport(0,0,w,h);
  gl.uniform2f(loc.uRes, w, h);
  gl.bindTexture(gl.TEXTURE_2D, tex);

/* ===== 自绘滚动 =====
   原生滚动由浏览器合成线程驱动：文字立刻动，WebGL 玻璃要等下一次 rAF 读到新位置才重画，
   于是一滑动气泡就和文字"分家"(iOS 惯性滚动时最明显)。
   改为自己算滚动位置，在同一个 rAF 里先写 transform、再画玻璃 → 两者同帧上屏，永远贴合。 */
const scroller = (() => {
  const vp = document.getElementById('msg-viewport');
  const track = document.getElementById('messages');
  let y = 0, v = 0;                 // 当前滚动距离(px)、惯性速度(px/ms，向下为正)
  let target = null;                // 平滑滚动目标：数字或 'bottom'
  let snap = false;                 // 下一帧直接跳到底(切换会话时用)
  let follow = true;                // 贴底：内容变高(流式输出/图片加载)时自动跟随
  let drag = null, suppressClick = 0, last = performance.now();
  const maxY = () => Math.max(0, track.offsetHeight - vp.clientHeight);
  // iOS 式橡皮筋：越拉越重
  const rubber = (over, dim) => Math.sign(over) * (1 - 1 / (Math.abs(over) * 0.55 / dim + 1)) * dim;
  const bounded = (raw, m) => raw < 0 ? rubber(raw, vp.clientHeight) : raw > m ? m + rubber(raw - m, vp.clientHeight) : raw;

  function tick(){
    const now = performance.now(), dt = Math.min(now - last, 50); last = now;
    const m = maxY();
    if(snap){ y = m; v = 0; target = null; snap = false; }
    else if(drag){ y = bounded(drag.raw, m); }
    else if(target !== null){
      const t = target === 'bottom' ? m : Math.min(Math.max(target, 0), m);
      y += (t - y) * (1 - Math.exp(-dt / 70));
      if(Math.abs(t - y) < 0.5){ y = t; target = null; }
    } else {
      const bound = y < 0 ? 0 : y > m ? m : null;
      if(bound !== null){
        // 越界：惯性迅速被吃掉，再弹回边界
        v *= Math.exp(-dt / 22);
        y += v * dt;
        y = bound + (y - bound) * Math.exp(-dt / 85);
        if(Math.abs(y - bound) < 0.4 && Math.abs(v) < 0.02){ y = bound; v = 0; }
      } else if(v !== 0){
        y += v * dt;
        v *= Math.pow(0.9975, dt);
        if(Math.abs(v) < 0.015) v = 0;
      }
      if(v === 0 && y >= m - 2) follow = true;
      if(follow && v === 0 && y < m - 0.5 && y >= 0) target = 'bottom';
    }
    // 取整到设备像素，和玻璃矩形的取整方式一致
    track.style.transform = 'translate3d(0,' + (-Math.round(y * dpr) / dpr) + 'px,0)';
  }

  vp.addEventListener('touchstart', e => {
    if(e.touches.length !== 1) return;
    const t = e.touches[0];
    drag = { startY: t.clientY, startScroll: y, raw: y, moved: false, samples: [[performance.now(), t.clientY]] };
    v = 0; target = null;
  }, { passive: true });
  vp.addEventListener('touchmove', e => {
    if(!drag) return;
    const t = e.touches[0], dy = drag.startY - t.clientY;
    if(!drag.moved && Math.abs(dy) < 6) return;
    if(!drag.moved){ drag.moved = true; drag.startY = t.clientY; drag.startScroll = y; follow = false; }
    e.preventDefault();
    drag.raw = drag.startScroll + (drag.startY - t.clientY);
    const now = performance.now();
    drag.samples.push([now, t.clientY]);
    while(drag.samples.length > 2 && now - drag.samples[0][0] > 90) drag.samples.shift();
  }, { passive: false });
  const endDrag = () => {
    if(!drag) return;
    if(drag.moved){
      const s = drag.samples, a = s[0], b = s[s.length - 1], dt = b[0] - a[0];
      // 手指停住再松开 → 不给惯性
      v = (dt > 0 && performance.now() - b[0] < 60) ? (a[1] - b[1]) / dt : 0;
      v = Math.max(-6, Math.min(6, v));
      y = bounded(drag.raw, maxY());
      suppressClick = performance.now();
    }
    drag = null;
  };
  vp.addEventListener('touchend', endDrag);
  vp.addEventListener('touchcancel', endDrag);
  // 拖动结束后紧跟着的 click 不算点击(避免松手时误开图片/思维链)
  vp.addEventListener('click', e => { if(performance.now() - suppressClick < 350){ e.stopPropagation(); e.preventDefault(); } }, true);

  vp.addEventListener('wheel', e => {
    e.preventDefault();
    const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? vp.clientHeight : 1;
    const m = maxY();
    y = Math.min(Math.max(y + e.deltaY * k, 0), m);
    v = 0; target = null; follow = y >= m - 2;
  }, { passive: false });

  return {
    tick,
    toBottom(instant){ follow = true; target = 'bottom'; if(instant) snap = true; },
  };
})();

const msgVp = document.getElementById('msg-viewport');
function frame(){
  resize();
  scroller.tick();
  if(glPaused){ requestAnimationFrame(frame); return; }
  const pr = phone.getBoundingClientRect(), vr = msgVp.getBoundingClientRect();
  const els = phone.querySelectorAll('.glass');
  const rects = new Float32Array(MAX*4), metas = new Float32Array(MAX*2); let n = 0;
  els.forEach(el => {
    if(n >= MAX) return;
    if(el.closest('.gl-off')) return;   // 开屏期间还没登场的界面不画玻璃
    const inMsg = msgVp.contains(el);
    const r = el.getBoundingClientRect(); if(r.width < 2 || r.height < 2) return;
    if(r.bottom < pr.top - 4 || r.top > pr.bottom + 4) return; // 只画可视区内的玻璃，避免超出上限
    if(inMsg && (r.bottom <= vr.top || r.top >= vr.bottom)) return; // 滑出消息视口的气泡完全不画(否则会抢走输入框的阴影)
    // 取整到整数设备像素：消除滚动时的亚像素抖动(玻璃边缘/高光"呼吸")
    const cx = Math.round((r.left-pr.left + r.width/2)*dpr), cy = Math.round((r.top-pr.top + r.height/2)*dpr);
    const hw = Math.round(r.width/2*dpr), hh = Math.round(r.height/2*dpr);
    let rad = parseFloat(getComputedStyle(el).borderTopLeftRadius) || 20;
    rad = Math.round(Math.min(rad*dpr, hw, hh));
    rects[n*4]=cx; rects[n*4+1]=cy; rects[n*4+2]=hw; rects[n*4+3]=hh;
    metas[n*2]=rad; metas[n*2+1] = colorId(el) + (inMsg ? 4 : 0); n++;
  });

  gl.uniform4fv(loc.uRect, rects); gl.uniform2fv(loc.uMeta, metas);
  const vt = (vr.top - pr.top) * dpr, vb = (vr.bottom - pr.top) * dpr;
  gl.uniform4f(loc.uFade, vt, vt + 34*dpr, vb - 20*dpr, vb);
  gl.uniform2f(loc.uLight, light[0], light[1]);
  gl.uniform1f(loc.uStrength, params.strength*dpr);
  gl.uniform1f(loc.uEdge, params.edge*dpr);
  gl.uniform1f(loc.uChroma, params.chroma);
  gl.uniform1f(loc.uGlow, params.glow);
  gl.uniform1f(loc.uRimPow, params.rimPow);
  gl.uniform1f(loc.uTint, params.tint);
  gl.uniform1f(loc.uTrans, params.trans);
  gl.uniform1f(loc.uVol, params.vol);
  gl.uniform1f(loc.uContrast, params.contrast);
  gl.uniform1f(loc.uShadow, params.shadow);
  // 气泡磨砂直接用 glassBlur(可低至 0 → 折射清脆，和 lab 一致)；输入框/顶栏保底更高保证可读
  gl.uniform1f(loc.uBlur, params.glassBlur * dpr);
  gl.uniform1f(loc.uBlurN, Math.max(params.glassBlur + 3, 5.5) * dpr);
  gl.uniform3fv(loc.uColAI, colAIv);
  gl.uniform3fv(loc.uColUser, colUserv);
  gl.uniform3fv(loc.uColNeutral, colNeutralv);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(loc.uTex, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}

// 轻量 Markdown（只给 AI 那边用）：**粗** *斜* ~~删~~ `代码` [文字](链接) # 标题
function mdInline(t){
  const store = [];
  const stash = h => { store.push(h); return '␀' + (store.length - 1) + '␀'; };
  let s = String(t == null ? '' : t).replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));
  s = s.replace(/```([\s\S]*?)```/g, (m, x) => stash('<pre><code>' + x.replace(/^\n/, '') + '</code></pre>'));
  s = s.replace(/`([^`\n]+)`/g, (m, x) => stash('<code>' + x + '</code>'));
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, txt, url) => stash('<a href="' + url + '" target="_blank" rel="noopener">' + txt + '</a>'));
  s = s.replace(/^(#{1,4})\s+(.+)$/gm, (m, h, x) => '<strong>' + x + '</strong>');
  s = s.replace(/\*\*([^\n]+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^\n]+?)__/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>');
  s = s.replace(/(^|[^\w])_([^_\n]+?)_(?![\w])/g, '$1<em>$2</em>');
  s = s.replace(/~~([^\n]+?)~~/g, '<del>$1</del>');
  s = s.replace(/\n/g, '<br>');
  return s.replace(/␀(\d+)␀/g, (m, i) => store[+i]);
}

// 上传前压缩，避免请求过大(413)
function resizeImage(file, maxDim = 1280, quality = 0.82){
  return new Promise((resolve) => {
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxDim / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        try { resolve(c.toDataURL('image/jpeg', quality)); } catch(e){ resolve(rd.result); }
      };
      img.onerror = () => resolve(rd.result);
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}

const STICKER_RE = /^\[\[sticker:\s*([^\]]+?)\s*\]\]$/;
function sidGen(){ return 's' + Math.random().toString(36).slice(2, 7); }
function nameFromUrl(u){ if(/^data:/.test(u)) return '表情'; const m = String(u).split('?')[0].split('/').pop() || ''; return (m.replace(/\.[a-z0-9]+$/i, '') || '表情').slice(0, 16); }

function renderStrip(){

  attachStrip.hidden = pendingImages.length === 0 && pendingFiles.length === 0;

// 图片：压缩加入待发图片
async function addImages(files){
  for(const f of files){ if(!f.type.startsWith('image/')) continue; const url = await resizeImage(f); pendingImages.push(url); renderStrip(); }
}
// 文件：图片走图片；文本类读取内容；其它仅记文件名
const TEXT_RE = /\.(txt|md|markdown|json|csv|log|js|ts|jsx|tsx|py|java|c|cpp|h|css|html|xml|yml|yaml|ini|sh|go|rs|php|rb|sql)$/i;
function readText(file){ return new Promise(r => { const rd = new FileReader(); rd.onload = () => r(String(rd.result || '')); rd.onerror = () => r(''); rd.readAsText(file); }); }
async function addAnyFiles(files){
  for(const f of files){
    if(f.type.startsWith('image/')){ const url = await resizeImage(f); pendingImages.push(url); }
    else if(TEXT_RE.test(f.name) || f.type.startsWith('text/')){ const txt = await readText(f); pendingFiles.push({ name: f.name, text: txt.slice(0, 20000) }); }
    else { pendingFiles.push({ name: f.name, text: null }); }
    renderStrip();
  }
}

// 组装系统提示：人设 + 记忆 + 分条风格
function buildSystem(){
  let s = (persona || '').trim();
  if(memory && memory.trim()) s += (s ? '\n\n' : '') + '【长期记忆】\n' + memory.trim();
  if(splitMode) s += (s ? '\n\n' : '') + '【消息风格】像真人聊天那样，把回复拆成 2~4 条简短的消息，一条一条发。每条之间用 ' + SPLIT_TOKEN + ' 或空行分隔。';
  if(stickers.length){
    s += (s ? '\n\n' : '') + '【表情包】你可以发送表情包，让聊天更生动。可用表情包（ID + 名称）：\n'
      + stickers.map(x => '- ' + x.id + '（' + x.name + '）').join('\n')
      + '\n想发表情包时，单独占一条消息输出 [[sticker:ID]]（ID 必须是上面列表里的，例如 [[sticker:' + stickers[0].id + ']]）。适度使用，不要每句都发。';
  }
  return s || '你是一个温柔友好的聊天助手，用中文自然地回复。';
}
// 分条：按 <split> 或空行拆成多段
function splitSegs(t){
  if(!splitMode) return [String(t).trim()];
  return String(t).split(/\s*<split>\s*|\n\s*\n/).map(s => s.trim()).filter(Boolean);
}
// 流式请求中转/官方 OpenAI 接口
// 只把真实对话(不含思维链)发回上下文；userContent 可为字符串或(含图片的)数组
async function streamAI(userContent, onDelta, onReason){
  const ctx = apiCfg.ctx || 40;
  const msgs = [{ role:'system', content: buildSystem() },
    ...history.slice(-ctx).map(m => ({ role: m.role, content: String(m.content).split(SPLIT_TOKEN).join('\n') })),
    { role:'user', content: userContent }];
  const payload = { model: apiCfg.model, messages: msgs, stream: true };
  if(apiCfg.temperature != null && !isNaN(apiCfg.temperature)) payload.temperature = apiCfg.temperature;
  const mt = parseInt(apiCfg.maxTokens); if(mt > 0) payload.max_tokens = mt;
  const res = await fetch(apiCfg.baseUrl.replace(/\/$/, '') + '/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiCfg.apiKey },
    body: JSON.stringify(payload)
  });
  if(!res.ok || !res.body) throw new Error('HTTP ' + res.status + ' ' + (await res.text().catch(()=> '')).slice(0, 160));
  const reader = res.body.getReader(); const dec = new TextDecoder();
  let buf = '', full = '', reason = '';
  while(true){
    const { value, done } = await reader.read(); if(done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while((idx = buf.indexOf('\n')) >= 0){
      const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
      if(!line.startsWith('data:')) continue;
      const data = line.slice(5).trim();
      if(data === '[DONE]') return { content: full, reasoning: reason };
      try {
        const j = JSON.parse(data);
        const d = j.choices && j.choices[0] && j.choices[0].delta;
        if(d){
          if(d.reasoning_content){ reason += d.reasoning_content; onReason && onReason(reason); }
          if(d.content){ full += d.content; onDelta(full); }
        }
      } catch(e){}
    }
  }
  return { content: full, reasoning: reason };
}

// 调用 API 并渲染 AI 回复（含表情包）
async function respond(userContent){
  typing = true; sendEl.disabled = true; showTyping();
  const configured = apiCfg.baseUrl && apiCfg.apiKey && apiCfg.model;
  if(configured){
    const bubbles = [];
    const put = (i, t) => {
      if(!bubbles[i]){ if(t === '') return; if(i === 0) hideTyping(); bubbles[i] = addBubble('left', ''); }
      if(bubbles[i]){ bubbles[i].innerHTML = mdInline(t); realign(bubbles[i]); }
    };
    const onDelta = splitMode
      ? (full) => { splitSegs(full).forEach((seg, i) => put(i, seg)); scrollDown(); }
      : (full) => { put(0, full); scrollDown(); };
    try {
      const { content, reasoning } = await streamAI(userContent, onDelta);
      hideTyping();
      const segs = splitSegs(content); if(segs.length === 0) segs.push('（空回复）');
      if(/\[\[sticker:/.test(content)){
        // 含表情包：清掉流式文字气泡，按段重渲染（文字/表情）
        bubbles.forEach(b => b.closest('.row')?.remove());
        let first = null;
        segs.forEach((seg, i) => { const el = addAiSeg(seg); if(i === 0) first = el; });
        if(first) attachReasoning(first, reasoning);
      } else {
        segs.forEach((seg, i) => put(i, seg));
        for(let i = segs.length; i < bubbles.length; i++) bubbles[i]?.closest('.row')?.remove();
        bubbles.length = segs.length;
        if(bubbles[0]) attachReasoning(bubbles[0], reasoning);
      }
      history.push({ role:'assistant', content: splitMode ? segs.join(SPLIT_TOKEN) : content, reasoning });
      saveHistory();
    } catch(err){
      hideTyping();
      bubbles.forEach(b => b.closest('.row')?.remove());
      addBubble('left', '⚠️ ' + err.message);
      history.pop();
    }
  } else {
    await new Promise(r => setTimeout(r, 700 + Math.random()*700));
    hideTyping();
    if(splitMode){ ['收到～', '这是分条发送的效果😋', '接了 API 就是真的一条条回啦'].forEach(t => addBubble('left', t)); }
    else addBubble('left', FAKE_REPLIES[Math.floor(Math.random()*FAKE_REPLIES.length)]);
  }
  typing = false; sendEl.disabled = false; inputEl.focus();
}

async function send(){
  const text = inputEl.value.trim();
  const images = pendingImages.slice();
  const files = pendingFiles.slice();
  if((!text && !images.length && !files.length) || typing) return;
  pendingImages = []; pendingFiles = []; renderStrip(); closePanels();
  addUserMessage(text, images, files);
  inputEl.value = ''; inputEl.style.height = 'auto';
  // 发给模型的文本（含文件内容）
  let apiText = text;
  files.forEach(f => {
    apiText += (apiText ? '\n\n' : '') + (f.text != null
      ? '【文件 ' + f.name + '】\n' + f.text
      : '【用户发送了文件：' + f.name + '（二进制，无法读取内容）】');
  });
  const userContent = images.length
    ? [ ...(apiText ? [{ type:'text', text: apiText }] : []), ...images.map(u => ({ type:'image_url', image_url:{ url:u } })) ]
    : apiText;
  const histText = text || (images.length ? '[图片]' : files.length ? '[文件]' : '');
  history.push({ role:'user', content: histText });
  await respond(userContent);
}

async function sendSticker(s){
  if(typing) return;
  const url = typeof s === 'string' ? resolveSticker(s) : s.url;
  const id  = typeof s === 'string' ? s : s.id;
  closePanels();
  addUserSticker(id);
  history.push({ role:'user', content: '[[sticker:' + id + ']]' });
  await respond([{ type:'image_url', image_url:{ url } }]);
}

/* ===== 开屏：水墨晕染 =====
   三层画面(上→下)：黑色星空 / 灰色水墨 / 镭射。全部由着色器实时生成，不需要素材图。
   手指划过的地方像墨在宣纸上洇开：先露出灰墨，越浓的地方再露出底下的镭射；
   松手后墨慢慢退回去，星空复原。轻点一下 → 从点击处整片晕开，露出聊天界面。
   手指只在水面上划出一道细线，但会激起水波纹往外扩：波纹扫过的地方墨被带着洇开，
   画面也随波面折射晃动。最浓的线芯里透出最底下的一层白。
   模拟是一张低分辨率纹理：R=墨浓度，G=水面高度，B=上一步高度(都以 0.5 为零点)。 */
let glPaused = false;   // 开屏完全遮住时，聊天界面的玻璃暂停绘制，省 GPU
(function inkSplash(){

  const viewport = document.getElementById('msg-viewport');
  const rows = [...messagesEl.querySelectorAll('.row')];
  const offs = [capsule, menuBtn, composer, ...rows];

  const splash = document.createElement('div'); splash.className = 'splash';
  const cv = document.createElement('canvas');
  const hint = document.createElement('div'); hint.className = 'splash-hint'; hint.textContent = '滑动晕染 · 轻触进入';

  const VS = 'attribute vec2 a; varying vec2 v; void main(){ v = a*0.5+0.5; gl_Position = vec4(a,0.0,1.0); }';
  const COMMON = `
precision highp float;
varying vec2 v;
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
}
float fbm(vec2 p){
  float s = 0.0, a = 0.5;
  for(int i = 0; i < 5; i++){ s += a * noise(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p; a *= 0.5; }
  return s;
}`;

  // —— 模拟：水波 + 墨(涡流平流、随波纹洇开、衰减复原) + 手指 ——
  const SIM = COMMON + `
uniform sampler2D uS; uniform vec2 uPx; uniform float uAsp, uT;
uniform vec2 uA, uB; uniform float uR, uAmt, uWave, uDecay;
void main(){
  vec4 c = texture2D(uS, v);
  // ① 水波：经典两帧波动方程，每次传播一格，阻尼让波纹慢慢平息
  float hl = texture2D(uS, v - vec2(uPx.x, 0.0)).g, hr = texture2D(uS, v + vec2(uPx.x, 0.0)).g;
  float hd = texture2D(uS, v - vec2(0.0, uPx.y)).g, hu = texture2D(uS, v + vec2(0.0, uPx.y)).g;
  float h0 = c.g - 0.5;
  float h = ((hl + hr + hd + hu) - 2.0) * 0.5 - (c.b - 0.5);
  h = mix(h, ((hl + hr + hd + hu) - 2.0) * 0.25, 0.03);   // 轻微抹平，去掉格子状的高频噪声
  h *= 0.985;
  vec2 grad = vec2(hr - hl, hu - hd);
  // ② 墨：顺着缓慢的环境涡流漂，被拉成丝
  vec2 cp = v * vec2(uAsp, 1.0) * 2.4 + uT * 0.03; float ce = 0.02;
  vec2 curl = vec2(fbm(cp + vec2(0.0, ce)) - fbm(cp - vec2(0.0, ce)), -(fbm(cp + vec2(ce, 0.0)) - fbm(cp - vec2(ce, 0.0)))) / (2.0 * ce);
  vec2 p = v - curl * 0.0009 / vec2(uAsp, 1.0);
  float m = texture2D(uS, p).r;
  float l = texture2D(uS, p - vec2(uPx.x, 0.0)).r, r = texture2D(uS, p + vec2(uPx.x, 0.0)).r;
  float d = texture2D(uS, p - vec2(0.0, uPx.y)).r, u = texture2D(uS, p + vec2(0.0, uPx.y)).r;

  float fib = fbm(v * vec2(uAsp, 1.0) * 9.0 + vec2(uT * 0.02, 0.0));
  float energy = clamp(abs(h0) * 16.0 + length(grad) * 12.0, 0.0, 1.0);
  m = mix(m, (l + r + d + u) * 0.25, 0.2 + 0.3 * energy);
  m = max(m, max(max(l, r), max(d, u)) * (0.78 + 0.10 * fib + 0.14 * energy) - 0.004);
  // ③ 手指：注墨的线很细，按下水面的范围稍宽 → 激起往外扩的波纹
  vec2 k = vec2(uAsp, 1.0), q = v * k, a = uA * k, ab = uB * k - a;
  float t = clamp(dot(q - a, ab) / max(dot(ab, ab), 1e-6), 0.0, 1.0);
  float dist = length(q - a - ab * t);
  m = min(1.0, m + exp(-dist * dist / (uR * uR)) * uAmt);
  h -= exp(-dist * dist / (9.0 * uR * uR)) * uWave;
  m = max(0.0, m - uDecay);
  gl_FragColor = vec4(m, clamp(h + 0.5, 0.0, 1.0), h0 + 0.5, 1.0);
}`;

  // —— 画面：星空 / 水墨 / 镭射 三层按墨浓度依次露出 ——
  const DRAW = COMMON + `
uniform sampler2D uS; uniform vec2 uRes, uSim; uniform float uT; uniform vec3 uExit;
vec3 stars(vec2 p){
  vec3 c = vec3(0.010, 0.011, 0.018) + vec3(0.035) * smoothstep(0.55, 0.95, fbm(p * 1.3 + 3.0));
  for(int i = 0; i < 2; i++){
    float sc = i == 0 ? 90.0 : 210.0;
    vec2 cell = floor(p * sc), f = fract(p * sc);
    float r = hash(cell + float(i) * 17.0);
    if(r > 0.93){
      vec2 o = vec2(hash(cell + 3.1), hash(cell + 7.7)) * 0.6 + 0.2;
      float tw = 0.55 + 0.45 * sin(uT * (1.0 + r * 3.0) + r * 40.0);
      float b = smoothstep(0.16, 0.0, length(f - o)) * tw * (i == 0 ? 1.0 : 0.6);
      c += vec3(0.92, 0.95, 1.0) * b;
    }
  }
  return c;
}
// 共享的大理石流场：水墨和镭射都顺着同一套流纹走，露出来的形状也跟着流纹
float marble(vec2 p, out vec2 q){
  q = vec2(fbm(p * 1.1 + uT * 0.015), fbm(p * 1.1 + vec2(5.2, 1.3) - uT * 0.012));
  vec2 r = vec2(fbm(p * 1.3 + q * 3.0 + vec2(1.7, 9.2)), fbm(p * 1.3 + q * 3.0 + vec2(8.3, 2.8)));
  return fbm(p * 1.2 + r * 2.4);
}
vec3 ink(vec2 p, float f, vec2 q){
  float gv = mix(0.20, 0.70, smoothstep(0.28, 0.78, f));
  float w = f * 46.0 + q.x * 9.0;
  gv -= 0.20 * smoothstep(0.82, 1.0, sin(w));               // 细黑流线
  gv += 0.16 * smoothstep(0.90, 1.0, sin(w * 0.5 + 1.7));   // 细白流线
  gv += (noise(p * 60.0) - 0.5) * 0.04;                      // 纸纹颗粒
  return vec3(gv) * vec3(0.97, 0.985, 1.03);
}
vec3 holo(vec2 p, float f, vec2 q){
  float hue = f * 3.2 + q.y * 1.5 + p.x * 0.25 + uT * 0.04;
  vec3 iri = 0.5 + 0.5 * cos(6.2832 * (hue + vec3(0.0, 0.33, 0.67)));
  iri = mix(iri, vec3(0.92, 0.95, 1.0), 0.38);                // 粉彩化
  float band = smoothstep(0.35, 0.75, fbm(p * 2.2 + q * 2.0 - uT * 0.02));

  return mix(silver, iri, 0.25 + 0.75 * band);                // 镭射是银底上一条条的彩光
}
float mask(vec2 uv, vec2 px){

  return 0.25 * (texture2D(uS, uv + vec2(px.x, px.y)).r + texture2D(uS, uv + vec2(-px.x, px.y)).r
              + texture2D(uS, uv + vec2(px.x, -px.y)).r + texture2D(uS, uv - px).r);
}
void main(){
  vec2 uv0 = gl_FragCoord.xy / uRes;
  float asp = uRes.x / uRes.y;

  vec2 px = 1.0 / uSim;
  vec2 grad = vec2(texture2D(uS, uv0 + vec2(px.x, 0.0)).g - texture2D(uS, uv0 - vec2(px.x, 0.0)).g,
                   texture2D(uS, uv0 + vec2(0.0, px.y)).g - texture2D(uS, uv0 - vec2(0.0, px.y)).g);
  vec2 uv = uv0 + grad * 0.03;
  vec2 p = uv * vec2(asp, 1.0) * 2.2;
  vec2 q; float f = marble(p, q);
  // 取墨时顺着流场偏一点 → 墨边被流纹拉成丝
  float m = mask(uv + (q - 0.5) * 0.07, px * 1.2);
  if(uExit.z > 0.0){
    float d = length((uv - uExit.xy) * vec2(asp, 1.0));
    m += max(0.0, uExit.z * 4.2 - d * 1.2);                     // 离场：从点击处整片晕开
  }
  float wave = 0.12 * smoothstep(0.01, 0.06, length(grad));      // 波峰上也会短暂透出一点
  float grain = (noise(p * 34.0) - 0.5) * 0.06;
  float e = m * 1.3 + wave + grain;
  // 墨淡时只有流纹最亮处先透出来，墨越浓露得越多
  float a1 = smoothstep(0.30, 0.36, e + (f - 0.5) * 1.3);        // 星空 → 灰墨
  float a2 = smoothstep(0.86, 0.92, e + (f - 0.5) * 1.9);        // 灰墨 → 镭射
  float a3 = smoothstep(1.18, 1.30, e + (f - 0.5) * 0.6);        // 镭射 → 最底下的白
  vec3 col = stars(p);
  col = mix(col, ink(p, f, q), a1);
  col *= 1.0 - a1 * (1.0 - a1) * 4.0 * 0.5;                        // 墨边一圈暗线
  col = mix(col, holo(p, f, q), a2);
  col += vec3(1.0) * a2 * (1.0 - a2) * 4.0 * 0.18;                 // 镭射边一道亮线
  col *= 1.0 - a2 * (1.0 - a3) * 0.28 * smoothstep(0.80, 1.0, sin(f * 46.0 + q.x * 9.0));   // 镭射上也压着同一套流线
  col = mix(col, vec3(0.97, 0.975, 1.0), a3);
  // 波峰高光：迎光的坡面亮一下，星空上也能看到一圈圈水纹
  vec3 n = normalize(vec3(-grad * 70.0, 1.0));
  col += vec3(0.9, 0.95, 1.0) * pow(max(dot(n, normalize(vec3(-0.35, 0.5, 1.0))), 0.0), 40.0) * 0.55;
  float alpha = 1.0 - smoothstep(2.6, 2.75, m * 1.3 + (f - 0.5) * 1.3);   // 只有离场时会透出聊天
  gl_FragColor = vec4(col * alpha, alpha);
}`;

  const sh = (t, src) => { const s = g.createShader(t); g.shaderSource(s, src); g.compileShader(s);
    if(!g.getShaderParameter(s, g.COMPILE_STATUS)) throw new Error(g.getShaderInfoLog(s)); return s; };
  const program = (fs, names) => {
    const pr = g.createProgram(); g.attachShader(pr, sh(g.VERTEX_SHADER, VS)); g.attachShader(pr, sh(g.FRAGMENT_SHADER, fs));
    g.bindAttribLocation(pr, 0, 'a'); g.linkProgram(pr);
    if(!g.getProgramParameter(pr, g.LINK_STATUS)) throw new Error(g.getProgramInfoLog(pr));
    const u = {}; names.forEach(n => u[n] = g.getUniformLocation(pr, n)); return { pr, u };
  };
  let sim, draw;
  try {
    sim = program(SIM, ['uS','uPx','uAsp','uT','uA','uB','uR','uAmt','uWave','uDecay']);
    draw = program(DRAW, ['uS','uRes','uSim','uT','uExit']);
  } catch(err){ console.warn('开屏着色器失败：', err); cleanup(); revealUI(false); return; }
  const buf = g.createBuffer(); g.bindBuffer(g.ARRAY_BUFFER, buf);
  g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), g.STATIC_DRAW);
  g.enableVertexAttribArray(0); g.vertexAttribPointer(0, 2, g.FLOAT, false, 0, 0);

  // 画布尺寸：画面最多 1.5 倍像素(着色器较重)，模拟用 1/3 分辨率
  const R = phone.getBoundingClientRect();
  const DPR = Math.min(devicePixelRatio || 1, 1.5);
  cv.width = Math.round(R.width * DPR); cv.height = Math.round(R.height * DPR);
  const SW = Math.max(32, Math.round(R.width / 3)), SH = Math.max(32, Math.round(R.height / 3));
  const asp = R.width / R.height;
  // 水波需要精度：能用半精度浮点纹理就用(iOS 都支持)，不行退回 8 位
  let TYPE = g.UNSIGNED_BYTE;
  const hf = g.getExtension('OES_texture_half_float');
  if(hf && g.getExtension('OES_texture_half_float_linear')){ g.getExtension('EXT_color_buffer_half_float'); TYPE = hf.HALF_FLOAT_OES; }
  const target = () => {
    const t = g.createTexture(); g.bindTexture(g.TEXTURE_2D, t);
    g.texImage2D(g.TEXTURE_2D, 0, g.RGBA, SW, SH, 0, g.RGBA, TYPE, null);
    [g.TEXTURE_MIN_FILTER, g.TEXTURE_MAG_FILTER].forEach(k => g.texParameteri(g.TEXTURE_2D, k, g.LINEAR));
    [g.TEXTURE_WRAP_S, g.TEXTURE_WRAP_T].forEach(k => g.texParameteri(g.TEXTURE_2D, k, g.CLAMP_TO_EDGE));
    const f = g.createFramebuffer(); g.bindFramebuffer(g.FRAMEBUFFER, f);
    g.framebufferTexture2D(g.FRAMEBUFFER, g.COLOR_ATTACHMENT0, g.TEXTURE_2D, t, 0);
    if(g.checkFramebufferStatus(g.FRAMEBUFFER) !== g.FRAMEBUFFER_COMPLETE && TYPE !== g.UNSIGNED_BYTE){
      TYPE = g.UNSIGNED_BYTE; return target();
    }
    g.clearColor(0, 0.5, 0.5, 1); g.clear(g.COLOR_BUFFER_BIT);
    return { t, f };
  };
  let A = target(), B = target();

  // —— 手势 → 每步要注入的线段 ——
  let pend = null, last = null, down = null, exitAt = null, exitStart = 0;
  const toUV = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height]; };
  const push = (pt, amt, wave) => { if(!last) last = pt; if(!pend) pend = { a: last, b: pt, amt, wave }; else { pend.b = pt; pend.amt = Math.max(pend.amt, amt); pend.wave = Math.max(pend.wave, wave); } last = pt; };
  splash.addEventListener('pointerdown', e => {
    if(exitAt) return;
    splash.setPointerCapture(e.pointerId);
    last = toUV(e); down = { t: performance.now(), x: e.clientX, y: e.clientY, moved: 0 };
    push(last, 0.5, 0.35);   // 按下：一滴墨 + 一圈水纹
  });
  splash.addEventListener('pointermove', e => {
    if(!down || exitAt) return;
    down.moved = Math.max(down.moved, Math.hypot(e.clientX - down.x, e.clientY - down.y));
    if(down.moved > 8) hint.classList.add('gone');
    const pt = toUV(e), sp = last ? Math.hypot((pt[0] - last[0]) * asp, pt[1] - last[1]) : 0;
    push(pt, 0.6, Math.min(0.22, 0.05 + sp * 3.0));   // 划得越快，激起的波越大
  });
  const up = e => {
    if(!down) return;
    if(e.type === 'pointerup' && down.moved < 10 && performance.now() - down.t < 350) startExit(toUV(e));
    down = null; last = null;
  };
  splash.addEventListener('pointerup', up);
  splash.addEventListener('pointercancel', up);

  // 开场自动"划"一笔做示范
  const t0 = performance.now(), INTRO = 1300;
  const introPt = t => [0.12 + 0.76 * t, 0.56 + 0.10 * Math.sin(t * 5.5) - 0.08 * t];
  let introLast = null;

  function step(now){
    if(now - t0 < INTRO && !down && !exitAt){
      const pt = introPt((now - t0) / INTRO);
      pend = { a: introLast || pt, b: pt, amt: 0.6, wave: 0.12 }; introLast = pt;
    }
    const s = pend; pend = null;
    g.useProgram(sim.pr);
    g.uniform2f(sim.u.uPx, 1 / SW, 1 / SH);
    g.uniform1f(sim.u.uAsp, asp);
    g.uniform1f(sim.u.uT, (now - t0) / 1000);
    g.uniform1f(sim.u.uR, 0.011);
    g.uniform1f(sim.u.uDecay, 0.0015);
    // 每步跑两次：波纹传得更快；手指只在第一次注入
    for(let i = 0; i < 2; i++){
      g.bindFramebuffer(g.FRAMEBUFFER, B.f); g.viewport(0, 0, SW, SH);
      g.activeTexture(g.TEXTURE0); g.bindTexture(g.TEXTURE_2D, A.t);
      g.uniform1i(sim.u.uS, 0);
      if(s && i === 0){
        g.uniform2f(sim.u.uA, s.a[0], s.a[1]); g.uniform2f(sim.u.uB, s.b[0], s.b[1]);
        g.uniform1f(sim.u.uAmt, s.amt); g.uniform1f(sim.u.uWave, s.wave);
      } else { g.uniform1f(sim.u.uAmt, 0); g.uniform1f(sim.u.uWave, 0); }
      g.drawArrays(g.TRIANGLES, 0, 3);
      const tmp = A; A = B; B = tmp;
    }
  }

  let acc = 0, prev = performance.now(), raf = 0;
  const STEP = 1000 / 60;   // 固定步长：120Hz 屏上晕染速度也一样
  function loop(now){
    acc += Math.min(now - prev, 100); prev = now;
    let k = 0; while(acc >= STEP && k < 4){ step(now); acc -= STEP; k++; }
    if(k === 4) acc = 0;
    const ex = exitAt ? Math.min(1, (now - exitStart) / 1100) : 0;
    g.useProgram(draw.pr);
    g.bindFramebuffer(g.FRAMEBUFFER, null); g.viewport(0, 0, cv.width, cv.height);
    g.activeTexture(g.TEXTURE0); g.bindTexture(g.TEXTURE_2D, A.t);
    g.uniform1i(draw.u.uS, 0);
    g.uniform2f(draw.u.uRes, cv.width, cv.height);
    g.uniform2f(draw.u.uSim, SW, SH);
    g.uniform1f(draw.u.uT, (now - t0) / 1000);
    g.uniform3f(draw.u.uExit, exitAt ? exitAt[0] : 0, exitAt ? exitAt[1] : 0, ex * ex);
    g.drawArrays(g.TRIANGLES, 0, 3);
    if(ex >= 1){ cleanup(); return; }
    raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop);

  function startExit(pt){
    if(exitAt) return;
    exitAt = pt; exitStart = performance.now();
    hint.classList.add('gone');
    splash.style.background = 'transparent';   // 底色只用来垫首帧，离场时要透出聊天
    glPaused = false;
    setTimeout(() => revealUI(true), 380);
  }
  function cleanup(){
    cancelAnimationFrame(raf);
    glPaused = false;
    splash.remove();
    const lose = g.getExtension('WEBGL_lose_context'); if(lose) lose.loseContext();
  }

  // 聊天界面登场：顶栏弹出，输入框滑上来，可见气泡自下而上长出来
  function revealUI(animate){
    phone.classList.remove('booting');
    if(!animate){ offs.forEach(el => el.classList.remove('gl-off')); return; }
    const SPRING = 'cubic-bezier(.2,1.3,.4,1)';
    const pop = (el, delay) => { el.classList.remove('gl-off');
      el.animate([{ opacity: 0, transform: 'scale(.4)' }, { opacity: 1, transform: 'none' }], { duration: 560, delay, easing: SPRING, fill: 'backwards' }); };
    pop(menuBtn, 0); pop(capsule, 60);
    composer.classList.remove('gl-off');
    composer.animate([{ opacity: 0, transform: 'translateY(120px)' }, { opacity: 1, transform: 'none' }], { duration: 640, easing: 'cubic-bezier(.2,.9,.25,1)', fill: 'backwards' });
    const V = viewport.getBoundingClientRect();
    const visible = rows.filter(r => { const b = r.getBoundingClientRect(); return b.bottom > V.top && b.top < V.bottom; }).reverse();
    rows.forEach(r => { if(!visible.includes(r)) r.classList.remove('gl-off'); });
    visible.forEach((r, i) => setTimeout(() => {
      r.classList.remove('gl-off');
      r.style.transformOrigin = r.classList.contains('right') ? 'right center' : 'left center';
      r.animate([{ opacity: 0, transform: 'translateY(14px) scale(.6)' }, { opacity: 1, transform: 'none' }], { duration: 480, easing: SPRING });
    }, 80 + i * 55));
  }
})();

/* 启动 WebGL */
try {
  if(initGL()){ requestAnimationFrame(frame); } else throw new Error('no webgl');
} catch(err){
  console.warn('WebGL 不可用，退回磨砂：', err);
  canvas.style.display = 'none';
  (function loop(){ scroller.tick(); requestAnimationFrame(loop); })();
  phone.style.background = 'linear-gradient(180deg,#4a5a68,#202932 45%,#0c1116)';
  document.querySelectorAll('.glass').forEach(el => {
    el.style.background = 'rgba(60,70,82,0.35)';
    el.style.backdropFilter = 'blur(16px) saturate(140%)';
    el.style.webkitBackdropFilter = 'blur(16px) saturate(140%)';
  });
}
</script>
