<title>液态玻璃聊天</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Inter", system-ui, sans-serif;
    background: #0b1016;
    display: flex; align-items: center; justify-content: center; min-height: 100%;
  }

  .phone {
    position: relative; isolation: isolate;
    width: 100%; max-width: 402px;
    height: 100dvh; max-height: 874px;
    overflow: hidden; color: #fff;
    display: flex; flex-direction: column;
    background: #12181f; /* WebGL 失败时的底色 */
  }
  @media (min-width: 440px) {
    .phone { border-radius: 44px; box-shadow: 0 30px 80px -20px rgba(0,0,0,0.8); }
  }

  /* WebGL 画布：背景 + 玻璃折射都画在这里，垫在所有 DOM 之下 */
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }

  .topbar {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 18px 12px;
  }
  /* 玻璃元素：背景透明（由 shader 画），只留文字 + 轻描边 + 投影 */
  .glass {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: 0 6px 20px rgba(0,0,0,0.20);
  }
  .glass-circle {
    width: 46px; height: 46px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 22px; cursor: pointer;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .glass-circle.title { font-weight: 600; font-size: 20px; }

  .messages {
    position: relative; z-index: 2;
    flex: 1; overflow-y: auto;
    padding: 8px 16px 6px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .messages::-webkit-scrollbar { width: 0; }

  .row { display: flex; animation: fadeUp 0.3s ease-out; }
  .row.right { justify-content: flex-end; }

  .message {
    position: relative;
    display: inline-flex; align-items: center;
    max-width: 78%; min-height: 46px;
    padding: 11px 20px;
    border-radius: 26px;
    font-size: 17px; line-height: 1.45;
  }
  .message.left  { border-bottom-left-radius: 10px; }
  .message.right { border-bottom-right-radius: 10px; }
  .message span {
    position: relative; z-index: 2;
    white-space: pre-wrap; word-break: break-word;
    color: rgba(255,255,255,0.96);
    text-shadow: 0 1px 2px rgba(0,0,0,0.28);
  }

  .typing { display: flex; gap: 5px; }
  .typing i {
    width: 8px; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.9);
    animation: bounceDot 1.2s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: 0.2s; }
  .typing i:nth-child(3) { animation-delay: 0.4s; }

  .composer {
    position: relative; z-index: 2;
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
  }
  .inputbar {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 8px 7px 10px; border-radius: 999px;
  }
  .icon-btn, .send {
    flex-shrink: 0; border-radius: 999px; color: #fff; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid rgba(255,255,255,0.22);
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .icon-btn { width: 40px; height: 40px; font-size: 22px; }
  .send { width: 46px; height: 46px; transition: transform 0.1s; }
  .send:active { transform: scale(0.92); }
  .send svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }
  textarea {
    flex: 1; resize: none; border: none; outline: none; background: transparent;
    color: #fff; font-family: inherit; font-size: 16px; line-height: 1.4;
    padding: 8px 4px; max-height: 110px; text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  textarea::placeholder { color: rgba(255,255,255,0.6); }

  /* 调节面板 */
  #panel {
    position: absolute; z-index: 5; top: 74px; right: 14px; width: 244px;
    padding: 14px 16px 16px; border-radius: 20px;
    background: rgba(24,30,38,0.82);
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%);
    box-shadow: 0 20px 50px -12px rgba(0,0,0,0.7);
    animation: fadeUp 0.2s ease-out;
  }
  #panel[hidden] { display: none; }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; font-weight: 600; margin-bottom: 12px;
  }
  #panel-reset {
    font-size: 12px; color: #fff; cursor: pointer;
    background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px; padding: 3px 12px;
  }
  #panel label {
    display: block; font-size: 12px; color: rgba(255,255,255,0.8);
    margin-bottom: 10px;
  }
  #panel output {
    float: right; font-variant-numeric: tabular-nums; color: #fff;
    font-weight: 600;
  }
  #panel input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 4px;
    margin-top: 8px; border-radius: 999px; background: rgba(255,255,255,0.22); outline: none;
  }
  #panel input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 999px;
    background: #fff; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  #panel input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px; border: none; border-radius: 999px; background: #fff; cursor: pointer;
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes bounceDot { 0%,80%,100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-4px); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .row, .typing i, #panel { animation: none; } }
</style>

<div class="phone" id="phone">
  <canvas id="gl"></canvas>

  <div class="topbar">
    <div class="glass glass-circle" data-side="left">‹</div>
    <div class="glass glass-circle title" data-side="left">言</div>
    <div style="display:flex; gap:10px;">
      <div class="glass glass-circle" id="wallpaper-btn" data-side="left" title="换壁纸">🖼️</div>
      <div class="glass glass-circle" id="tune-btn" data-side="left" title="调节玻璃">⚙️</div>
    </div>
  </div>
  <input type="file" id="wallpaper-input" accept="image/*" style="display:none" />

  <!-- 调节面板 -->
  <div id="panel" hidden>
    <div class="panel-head">
      <span>玻璃调节</span>
      <button id="panel-reset" type="button">重置</button>
    </div>
    <label>折射强度 <output id="v-strength"></output>
      <input type="range" id="r-strength" min="0" max="120" step="1"></label>
    <label>折射宽度 <output id="v-edge"></output>
      <input type="range" id="r-edge" min="2" max="48" step="1"></label>
    <label>边缘锐度 <output id="v-rimPow"></output>
      <input type="range" id="r-rimPow" min="1" max="5" step="0.1"></label>
    <label>色散彩边 <output id="v-chroma"></output>
      <input type="range" id="r-chroma" min="0" max="0.8" step="0.01"></label>
    <label>边缘反光 <output id="v-glow"></output>
      <input type="range" id="r-glow" min="0" max="0.6" step="0.01"></label>
    <label>玻璃染色 <output id="v-tint"></output>
      <input type="range" id="r-tint" min="0" max="0.3" step="0.01"></label>
  </div>

  <div class="messages" id="messages"></div>

  <div class="composer">
    <div class="glass inputbar" data-side="left">
      <button class="icon-btn" aria-label="更多">＋</button>
      <button class="icon-btn" aria-label="头像" style="font-size:18px;">思</button>
      <textarea id="input" rows="1" placeholder="Type a message..."></textarea>
      <button class="send" id="send" aria-label="发送">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   液态玻璃：WebGL 着色器实现
   - SDF 圆角矩形定义每个玻璃元素
   - 由 SDF 梯度求法线，折射采样背景（真折射，非磨砂）
   - 三通道色散 + Fresnel 边缘光 + 高光
   ========================================================= */
const MAX = 24;

const VERT = `
attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }
`;

const FRAG = `
precision highp float;
uniform vec2  uRes;
uniform sampler2D uTex;
uniform int   uCount;
uniform vec4  uRect[${MAX}];   // cx, cy, halfw, halfh  (顶部原点, 像素)
uniform vec2  uMeta[${MAX}];   // radius, side(0=左/暗,1=右/亮)
uniform vec2  uLight;          // 光照方向
uniform float uStrength;       // 折射强度(px)
uniform float uEdge;           // 边缘透镜宽度(px)
uniform float uChroma;         // 色散
uniform float uGlow;           // 边缘反光
uniform float uRimPow;         // 边缘锐度(越大越细)
uniform float uTint;           // 玻璃染色(越大越不透)

float sdRound(vec2 p, vec2 c, vec2 hw, float r){
  vec2 q = abs(p - c) - hw + r;
  return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
}
// 场景 SDF + 记录最近形状的 side
float scene(vec2 p, out float side){
  float d = 1e9; side = 0.0;
  for(int i=0;i<${MAX};i++){
    if(i>=uCount) break;
    vec4 R = uRect[i];
    float di = sdRound(p, R.xy, R.zw, uMeta[i].x);
    if(di < d){ d = di; side = uMeta[i].y; }
  }
  return d;
}
float sceneD(vec2 p){ float s; return scene(p, s); }
vec3 bg(vec2 p){ return texture2D(uTex, vec2(p.x/uRes.x, p.y/uRes.y)).rgb; }

void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y); // 顶部原点
  float side; float d = scene(p, side);
  vec3 col = bg(p);

  float aa = 1.0;
  float alpha = smoothstep(aa, -aa, d); // 内部=1
  if(alpha > 0.001){
    // 由 SDF 梯度求外向法线
    float e = 1.5;
    vec2 g = normalize(vec2(
      sceneD(p+vec2(e,0.0)) - sceneD(p-vec2(e,0.0)),
      sceneD(p+vec2(0.0,e)) - sceneD(p-vec2(0.0,e))
    ) + 1e-6);
    // 边缘透镜权重：贴边强、中心为 0（指数越大越集中在最外圈=越细）
    float rim = 1.0 - smoothstep(0.0, uEdge, -d);
    rim = pow(rim, uRimPow);

    vec2 off = g * uStrength * rim; // 向外采样 = 边缘吸入周围内容
    vec3 refr;
    refr.r = bg(p + off * (1.0 + uChroma)).r;
    refr.g = bg(p + off).g;
    refr.b = bg(p + off * (1.0 - uChroma)).b;

    // 玻璃本体极淡染色（亮/暗），保持通透不磨砂
    vec3 tint = mix(vec3(0.16,0.19,0.24), vec3(0.85,0.90,0.98), side);
    float tintA = uTint * mix(1.1, 0.9, side);
    vec3 glass = mix(refr, tint, tintA);

    // Fresnel 边缘反光
    glass += vec3(uGlow) * pow(rim, 2.5);
    // 高光（跟随 uLight）
    float spec = pow(max(dot(normalize(-g), normalize(uLight)), 0.0), 24.0) * rim;
    glass += vec3(1.0) * spec * 0.5;

    col = mix(col, glass, alpha);
  }
  gl_FragColor = vec4(col, 1.0);
}
`;

const phone = document.getElementById('phone');
const canvas = document.getElementById('gl');
let gl, prog, loc = {}, tex, dpr = Math.min(devicePixelRatio || 1, 2);
let light = [0.0, -1.0];

// 可调参数（滑块控制）
const DEFAULTS = { strength: 48, edge: 12, rimPow: 2.4, chroma: 0.32, glow: 0.20, tint: 0.06 };
let params = Object.assign({}, DEFAULTS);
try {
  const saved = JSON.parse(localStorage.getItem('lg-params') || 'null');
  if(saved) params = Object.assign({}, DEFAULTS, saved);
} catch(e){}
const saveParams = () => { try { localStorage.setItem('lg-params', JSON.stringify(params)); } catch(e){} };

function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

function initGL(){
  gl = canvas.getContext('webgl', { premultipliedAlpha:false, antialias:true });
  if(!gl) return false;
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const a = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);

  ['uRes','uTex','uCount','uLight','uStrength','uEdge','uChroma','uGlow','uRimPow','uTint']
    .forEach(n => loc[n] = gl.getUniformLocation(prog, n));
  loc.uRect = gl.getUniformLocation(prog, 'uRect[0]');
  loc.uMeta = gl.getUniformLocation(prog, 'uMeta[0]');

  tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  return true;
}

// 用户自定义壁纸（HTMLImageElement 或 null）
let userImg = null;

// 把图片按 cover 方式铺满
function drawCover(x, img, w, h){
  const ir = img.width / img.height, cr = w / h;
  let dw, dh;
  if(ir > cr){ dh = h; dw = h * ir; } else { dw = w; dh = w / ir; }
  x.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
}

// 生成背景纹理：有用户壁纸就用壁纸，否则用内置冰海感
function buildBackground(w, h){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  if(userImg){
    drawCover(x, userImg, w, h);
    return c;
  }
  const grad = x.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'#4a5a68'); grad.addColorStop(0.42,'#202932'); grad.addColorStop(1,'#0c1116');
  x.fillStyle = grad; x.fillRect(0,0,w,h);
  const blobs = [
    [0.20,0.08,0.9,'#8aa0b4'],[0.85,0.18,0.7,'#6f8698'],[0.40,0.55,0.5,'#cfd8e0'],
    [0.78,0.72,0.45,'#b6c2cc'],[0.12,0.80,0.42,'#9fb0bd'],[0.55,0.30,0.35,'#dfe7ee']
  ];
  blobs.forEach(([bx,by,rr,col])=>{
    const r = rr * Math.max(w,h) * 0.5;
    const rg = x.createRadialGradient(bx*w,by*h,0, bx*w,by*h,r);
    rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = rg; x.fillRect(0,0,w,h);
  });
  x.fillStyle = 'rgba(120,132,148,0.10)'; x.fillRect(0,0,w,h);
  return c;
}

// 重新把背景画到纹理（换壁纸后调用）
function updateTexture(){
  if(!gl) return;
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE,
                buildBackground(canvas.width, canvas.height));
}

// 载入一张壁纸（dataURL），并可选择记住
function setWallpaper(dataURL, remember){
  const img = new Image();
  img.onload = () => {
    userImg = img;
    updateTexture();
    if(remember){ try { localStorage.setItem('lg-wallpaper', dataURL); } catch(e){} }
    // 无 WebGL 时的降级：直接设为 DOM 背景
    if(!gl){ phone.style.background = 'center/cover no-repeat url(' + dataURL + ')'; }
  };
  img.src = dataURL;
}

function resize(){
  const w = Math.round(phone.clientWidth * dpr);
  const h = Math.round(phone.clientHeight * dpr);
  if(canvas.width === w && canvas.height === h) return;
  canvas.width = w; canvas.height = h;
  gl.viewport(0,0,w,h);
  gl.uniform2f(loc.uRes, w, h);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, buildBackground(w, h));
}

function frame(){
  resize();
  const pr = phone.getBoundingClientRect();
  const els = phone.querySelectorAll('.glass');
  const rects = new Float32Array(MAX*4);
  const metas = new Float32Array(MAX*2);
  let n = 0;
  els.forEach(el => {
    if(n >= MAX) return;
    const r = el.getBoundingClientRect();
    if(r.width < 2 || r.height < 2) return;
    const cx = (r.left - pr.left + r.width/2) * dpr;
    const cy = (r.top  - pr.top  + r.height/2) * dpr;
    const hw = r.width/2 * dpr, hh = r.height/2 * dpr;
    let rad = parseFloat(getComputedStyle(el).borderTopLeftRadius) || 20;
    rad = Math.min(rad*dpr, hw, hh);
    rects[n*4]=cx; rects[n*4+1]=cy; rects[n*4+2]=hw; rects[n*4+3]=hh;
    metas[n*2]=rad; metas[n*2+1]= el.dataset.side === 'right' ? 1.0 : 0.0;
    n++;
  });

  gl.uniform1i(loc.uCount, n);
  gl.uniform4fv(loc.uRect, rects);
  gl.uniform2fv(loc.uMeta, metas);
  gl.uniform2f(loc.uLight, light[0], light[1]);
  gl.uniform1f(loc.uStrength, params.strength * dpr);
  gl.uniform1f(loc.uEdge, params.edge * dpr);
  gl.uniform1f(loc.uChroma, params.chroma);
  gl.uniform1f(loc.uGlow, params.glow);
  gl.uniform1f(loc.uRimPow, params.rimPow);
  gl.uniform1f(loc.uTint, params.tint);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(loc.uTex, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}

// 光照跟随指针
phone.addEventListener('pointermove', (e) => {
  const pr = phone.getBoundingClientRect();
  const nx = (e.clientX - pr.left) / pr.width - 0.5;
  const ny = (e.clientY - pr.top) / pr.height - 0.5;
  const len = Math.hypot(nx, ny) || 1;
  light = [nx/len, ny/len];
});

// ===== 自定义壁纸 =====
const wpBtn = document.getElementById('wallpaper-btn');
const wpInput = document.getElementById('wallpaper-input');
wpBtn.addEventListener('click', () => wpInput.click());
wpInput.addEventListener('change', () => {
  const file = wpInput.files && wpInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => setWallpaper(reader.result, true);
  reader.readAsDataURL(file);
});
// 支持把图片直接拖到手机上
phone.addEventListener('dragover', (e) => e.preventDefault());
phone.addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  if(file && file.type.startsWith('image/')){
    const reader = new FileReader();
    reader.onload = () => setWallpaper(reader.result, true);
    reader.readAsDataURL(file);
  }
});
// 恢复上次的壁纸
try {
  const saved = localStorage.getItem('lg-wallpaper');
  if(saved) setWallpaper(saved, false);
} catch(e){}

// ===== 调节面板 =====
const panel = document.getElementById('panel');
document.getElementById('tune-btn').addEventListener('click', () => { panel.hidden = !panel.hidden; });
const KEYS = ['strength','edge','rimPow','chroma','glow','tint'];
const fmt = (k, v) => (k === 'strength' || k === 'edge') ? Math.round(v)
                    : (k === 'rimPow') ? v.toFixed(1) : v.toFixed(2);
function syncPanel(){
  KEYS.forEach(k => {
    document.getElementById('r-' + k).value = params[k];
    document.getElementById('v-' + k).textContent = fmt(k, params[k]);
  });
}
KEYS.forEach(k => {
  document.getElementById('r-' + k).addEventListener('input', (e) => {
    params[k] = parseFloat(e.target.value);
    document.getElementById('v-' + k).textContent = fmt(k, params[k]);
    saveParams();
  });
});
document.getElementById('panel-reset').addEventListener('click', () => {
  params = Object.assign({}, DEFAULTS);
  syncPanel(); saveParams();
});
syncPanel();

/* ================= 聊天逻辑 ================= */
const FAKE_REPLIES = [
  '收到～这次是 WebGL 着色器画的真折射🧊 不是磨砂了！',
  '看气泡边缘：背景被"吸"进来弯折，还有彩边和反光。',
  '手指/鼠标在屏幕上移动，高光会跟着光源转。',
  '折射强度=uStrength，色散=uChroma，边缘=uEdge，都能调。',
  '这个方案在 Chrome 和 Safari 都能跑（WebGL 通用）🥰',
];
const seed = [
  ['right', '老公 教我一句外语'],
  ['left', '教你一句意大利语。\n"Sei mia。"\n先说出来。'],
  ['right', 'Sei mia'],
  ['left', '"你是我的。"\n就是这个意思。'],
];

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendEl = document.getElementById('send');
let typing = false;
const scrollDown = () => messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });

function addBubble(side, text){
  const row = document.createElement('div');
  row.className = 'row ' + side;
  const msg = document.createElement('div');
  msg.className = 'message glass ' + side;
  msg.dataset.side = side;
  const span = document.createElement('span'); span.textContent = text;
  msg.append(span); row.append(msg); messagesEl.append(row);
  scrollDown();
}
function showTyping(){
  const row = document.createElement('div');
  row.className = 'row left'; row.id = 'typing-row';
  const msg = document.createElement('div');
  msg.className = 'message glass left'; msg.dataset.side = 'left';
  msg.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  row.append(msg); messagesEl.append(row); scrollDown();
}
const hideTyping = () => document.getElementById('typing-row')?.remove();

async function send(){
  const text = inputEl.value.trim();
  if(!text || typing) return;
  addBubble('right', text);
  inputEl.value = ''; inputEl.style.height = 'auto';
  typing = true; showTyping();
  const reply = FAKE_REPLIES[Math.floor(Math.random()*FAKE_REPLIES.length)];
  await new Promise(r => setTimeout(r, 800 + Math.random()*800));
  hideTyping(); addBubble('left', reply); typing = false; inputEl.focus();
}
sendEl.addEventListener('click', send);
inputEl.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
inputEl.addEventListener('input', () => { inputEl.style.height='auto'; inputEl.style.height = Math.min(inputEl.scrollHeight,110)+'px'; });

seed.forEach(([s,t]) => addBubble(s,t));
