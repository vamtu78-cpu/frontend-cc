<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AI 群聊</title>
<style>
  :root{
    --bg:#0f1020; --bg2:#1a1438; --glass:rgba(255,255,255,.07); --glass-hi:rgba(255,255,255,.14);
    --line:rgba(255,255,255,.12); --text:#eef0ff; --muted:rgba(238,240,255,.55);
    --me:linear-gradient(135deg,#7c6cff,#b16cff); --accent:#9d8bff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;
    color:var(--text); background:var(--bg);
    background-image:radial-gradient(60% 50% at 15% 0%,#3a2a7a 0%,transparent 70%),
                     radial-gradient(50% 40% at 100% 100%,#1d4a6e 0%,transparent 70%);
    background-attachment:fixed;
  }
  .app{height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
  .glass{background:var(--glass);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--line)}

  header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-width:0 0 1px}
  header h1{font-size:16px;font-weight:600;flex:1}
  header .members{font-size:12px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:#555;flex:none}
  .dot.on{background:#4ade80;box-shadow:0 0 8px #4ade80}

  #list{flex:1;overflow-y:auto;padding:16px 16px 0;-webkit-overflow-scrolling:touch}
  #msgs{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;padding-bottom:20px}
  #msgs>.row,#msgs>.time{position:relative;z-index:1}
  .row{display:flex;gap:8px;align-items:flex-start;max-width:100%}
  .row.me{flex-direction:row-reverse}
  .avatar{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:16px;font-weight:600;color:#fff}
  .col{display:flex;flex-direction:column;min-width:0;max-width:78%}
  .row.me .col{align-items:flex-end}
  .name{font-size:12px;color:var(--muted);margin:0 4px 3px}
  .name .tag{font-size:10px;padding:1px 6px;border-radius:8px;background:var(--glass-hi);margin-left:4px}
  .bubble{padding:9px 13px;border-radius:18px;border-top-left-radius:6px;white-space:pre-wrap;word-break:break-word;background:var(--glass-hi);border:1px solid var(--line)}
  .row.me .bubble{background:var(--me);border:none;border-radius:18px;border-top-right-radius:6px}
  .row.bot .bubble{border-color:color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 16%,rgba(255,255,255,.05))}
  .row.err .bubble{opacity:.6;font-size:13px}
  .typing::after{content:"▍";animation:blink 1s steps(2) infinite;margin-left:1px;color:var(--c,var(--accent))}
  @keyframes blink{50%{opacity:0}}
  .time{text-align:center;font-size:11px;color:var(--muted)}

  footer{padding:8px 12px calc(env(safe-area-inset-bottom) + 10px);border-width:1px 0 0}
  .chips{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto}
  .chip{flex:none;font-size:12px;padding:4px 10px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--text);cursor:pointer}
  .chip.stop{margin-left:auto;color:#ff9b9b}
  .input{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;resize:none;max-height:140px;min-height:42px;padding:10px 14px;border-radius:21px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);font:inherit;font-size:16px;outline:none}
  textarea:focus{border-color:var(--accent)}
  button.send{width:42px;height:42px;border-radius:50%;border:none;background:var(--me);color:#fff;font-size:18px;cursor:pointer;flex:none}
  button.send:disabled{opacity:.4}

  #login{position:fixed;inset:0;display:grid;place-items:center;padding:16px;z-index:10;background:rgba(10,10,25,.55)}
  #login .card{width:100%;max-width:340px;padding:28px 22px;border-radius:24px;display:flex;flex-direction:column;gap:12px}
  #login h2{font-size:20px;text-align:center;margin-bottom:4px}
  #login p{font-size:13px;color:var(--muted);text-align:center}
  #login input{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);font-size:16px;outline:none}
  #login button{padding:12px;border-radius:14px;border:none;background:var(--me);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  #login .err{color:#ff9b9b;min-height:18px}
  .avatar{overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  #wall{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center}
  #menuBtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--text);font-size:15px;cursor:pointer;flex:none}
  #menu{position:fixed;top:calc(env(safe-area-inset-top) + 56px);right:max(12px,calc(50vw - 368px));z-index:5;min-width:210px;padding:6px;border-radius:18px;display:flex;flex-direction:column;background:rgba(30,26,60,.82)}
  #menu button{padding:11px 14px;border:none;background:none;color:var(--text);font-size:15px;text-align:left;border-radius:12px;cursor:pointer}
  #menu button:active{background:var(--glass-hi)}
  #menu hr{border:none;border-top:1px solid var(--line);margin:4px 8px}
  #menu .note{font-size:11px;color:var(--muted);padding:0 14px 6px}
  /* 液态玻璃：气泡本身透明，玻璃由背后的 WebGL 画布绘制 */
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:none}
  #gl{position:absolute;left:0;top:0;z-index:0;pointer-events:none}
  body.lg #bg{display:block}
  body.lg #wall{display:none}
  body.lg .bubble,body.lg .row.me .bubble,body.lg .row.bot .bubble{
    background:transparent;border:none;border-radius:var(--br,23px);padding:var(--py,9px) var(--px,20px);
    color:rgba(255,255,255,.96);text-shadow:0 1px 2px rgba(0,0,0,.3)}
  body.lg .row.err .bubble{opacity:.75}

  #styler{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:0 auto;max-height:52vh;overflow-y:auto;
    padding:14px 18px calc(env(safe-area-inset-bottom) + 16px);border-radius:24px 24px 0 0;background:rgba(22,20,44,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 -8px 30px rgba(0,0,0,.4);
    -webkit-overflow-scrolling:touch}
  #styler .tabs{display:flex;gap:8px;margin-bottom:10px;align-items:center}
  #styler .tab{padding:6px 12px;border-radius:14px;border:1px solid var(--line);background:none;color:var(--muted);font-size:13px;cursor:pointer}
  #styler .tab.on{background:var(--glass-hi);color:var(--text);border-color:var(--accent)}
  #styler .x{margin-left:auto;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:0 4px}
  #styler label{display:block;font-size:12px;color:rgba(238,240,255,.8);margin-bottom:9px}
  #styler output{float:right;font-variant-numeric:tabular-nums;color:var(--text);font-weight:600}
  #styler input[type=range]{width:100%;accent-color:var(--accent);margin-top:2px}
  #styler .colorrow{display:flex;align-items:center;justify-content:space-between;font-size:12px;margin-bottom:10px}
  #styler input[type=color]{width:44px;height:28px;border:none;background:none;padding:0}
  #styler .reset{margin-top:6px;width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--text);font-size:14px;cursor:pointer}
  #styler .hint{font-size:11px;color:var(--muted);margin:-4px 0 10px}
  .hidden{display:none!important}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="wall"></div>
<div class="app">
  <header class="glass">
    <span class="dot" id="dot"></span>
    <h1 id="title">AI 群聊</h1>
    <span class="members" id="members"></span>
    <button id="menuBtn" aria-label="设置">⚙️</button>
  </header>
  <div id="list"><div id="msgs"></div></div>
  <footer class="glass">
    <div class="chips" id="chips"></div>
    <div class="input">
      <textarea id="box" rows="1" placeholder="说点什么… @名字 可以点名 AI"></textarea>
      <button class="send" id="send" aria-label="发送">➤</button>
    </div>
  </footer>
</div>

<div id="menu" class="glass hidden"></div>
<div id="styler" class="hidden"></div>
<input id="picker" type="file" accept="image/*" hidden>

<div id="login" class="hidden">
  <div class="card glass">
    <h2>进入群聊 💬</h2>
    <p>起个昵称，填上房间口令</p>
    <input id="lname" placeholder="你的昵称" maxlength="20" autocomplete="nickname">
    <input id="lkey" placeholder="房间口令" type="password">
    <button id="lgo">进入</button>
    <p class="err" id="lerr"></p>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
let me = store.get('gc-name'), key = store.get('gc-key');
let bots = [], es = null;
let avatars = { humans: {}, bots: {} };   // 服务器同步，所有人可见
const els = new Map();   // 消息 id → {row, bubble}
const list = $('#list'), msgs = $('#msgs');

const PALETTE = ['#ff8fab','#7cc6fe','#ffd166','#80ed99','#c77dff','#ff9f68'];
function colorOf(name){ let h = 0; for(const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; }
const esc = s => s.replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/@(\S+)/g, '<b>@$1</b>');

async function api(p, opt = {}){
  const r = await fetch(p.replace(/^\//, ''), { ...opt, headers: { 'Content-Type': 'application/json', 'X-Room-Key': key, ...(opt.headers || {}) } });
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw Object.assign(new Error(j.error || r.status), { status: r.status });
  return j;
}

function nearBottom(){ return list.scrollHeight - list.scrollTop - list.clientHeight < 120; }
function toBottom(force){ if(force || nearBottom()) requestAnimationFrame(() => list.scrollTop = list.scrollHeight); }

let lastTs = 0;
function render(m){
  if(els.has(m.id)) return update(m);
  if(m.ts - lastTs > 10 * 60 * 1000){
    const t = document.createElement('div');
    t.className = 'time';
    t.textContent = new Date(m.ts).toLocaleString('zh-CN', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
    msgs.appendChild(t);
  }
  lastTs = m.ts;
  const bot = bots.find(b => b.id === m.botId);
  const isMe = m.role === 'human' && m.name === me;
  const c = bot?.color || colorOf(m.name);
  const row = document.createElement('div');
  row.className = 'row' + (isMe ? ' me' : '') + (bot ? ' bot' : '') + (m.error ? ' err' : '');
  row.style.setProperty('--c', c);
  row.dataset.sk = bot ? 'b:' + bot.id : 'h:' + m.name;
  row.innerHTML = `
    <div class="avatar" style="background:${bot ? 'color-mix(in srgb,' + c + ' 35%,#1a1438)' : c}" data-av="${bot ? 'b:' + esc(bot.id) : 'h:' + esc(m.name)}" data-fb="${esc(bot?.avatar || m.name.slice(0, 1))}"></div>
    <div class="col">
      ${isMe ? '' : `<div class="name">${esc(m.name)}${bot ? `<span class="tag">${esc(bot.owner ? bot.owner + '的AI' : 'AI')}</span>` : ''}</div>`}
      <div class="bubble"></div>
    </div>`;
  paintAvatar(row.querySelector('.avatar'));
  const bubble = row.querySelector('.bubble');
  els.set(m.id, { row, bubble, text: m.text || '' });
  if(!styles[row.dataset.sk] && !geomSheet.textContent.includes(row.dataset.sk)) applyGeometry();
  msgs.appendChild(row);
  update(m);
}
function update(m){
  const e = els.get(m.id); if(!e) return;
  e.text = m.text ?? e.text;
  e.bubble.innerHTML = fmt(e.text);
  e.bubble.classList.toggle('typing', !!m.streaming);
  e.row.classList.toggle('err', !!m.error);
}

/* ================= 液态玻璃（移植自聊天 App 的着色器，改成每人一套参数） ================= */
const STYLE_SPEC = [
  ['strength',  '折射强度',   0, 120, 1],
  ['edge',      '玻璃厚度',   8, 80, 1],
  ['rimPow',    '折射衰减',   0.6, 4, 0.1],
  ['chroma',    '色散彩边',   0, 0.8, 0.01],
  ['trans',     '透明度',     0, 1, 0.01],
  ['contrast',  '自适应对比', 0, 1.5, 0.01],
  ['shadow',    '阴影分离',   0, 1, 0.01],
  ['vol',       '体积光',     0, 0.5, 0.01],
  ['glow',      '迎光边缘',   0, 0.9, 0.01],
  ['tint',      '玻璃染色',   0, 0.6, 0.01],
  ['glassBlur', '玻璃模糊',   0, 12, 1],
  ['bubRadius', '圆角',       8, 40, 1],
  ['bubPadX',   '左右宽度',   2, 60, 1],
  ['bubPadY',   '上下高度',   2, 40, 1],
];
// 聊天 App 实验台标定的那组参数
const GLASS_DEFAULTS = { strength:24, edge:18, rimPow:1.5, chroma:0.12, trans:0.94, contrast:0.59, shadow:0.5,
                         vol:0.06, glow:0.5, tint:0.12, glassBlur:3, bubRadius:23, bubPadX:20, bubPadY:9 };
let styles = {};                 // 服务器同步："h:昵称" / "b:botId" → 参数
const editedAt = {};             // 自己刚拖过的滑块，短时间内不被服务器回显覆盖
function defaultColor(sk){
  if(sk.startsWith('b:')){ const b = bots.find(x => 'b:' + x.id === sk); return b?.color || '#9d8bff'; }
  return colorOf(sk.slice(2));
}
const styleOf = sk => ({ ...GLASS_DEFAULTS, color: defaultColor(sk), ...(styles[sk] || {}) });

// 气泡几何（圆角/内边距）走 CSS 变量，按 data-sk 生成规则
const geomSheet = document.createElement('style'); document.head.appendChild(geomSheet);
function applyGeometry(){
  const keys = new Set([...Object.keys(styles), ...[...document.querySelectorAll('[data-sk]')].map(r => r.dataset.sk)]);
  geomSheet.textContent = [...keys].map(sk => { const st = styleOf(sk);
    return `.row[data-sk="${CSS.escape(sk)}"]{--br:${st.bubRadius}px;--px:${st.bubPadX}px;--py:${st.bubPadY}px}`; }).join('\n');
  glDirty = true;
}
function onServerStyles(next){
  const now = Date.now();
  for(const k of Object.keys(editedAt)) if(now - editedAt[k] < 1500 && styles[k]) next[k] = styles[k];
  styles = next; applyGeometry(); uploadStyles(); if(!$('#styler').classList.contains('hidden')) syncStyler();
}

const MAXB = 48, MAXS = 8;
const VERT = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.0,1.0); }`;
const FRAG = `
precision highp float;
uniform vec2 uRes; uniform sampler2D uTex; uniform int uCount; uniform vec2 uOrigin; uniform vec2 uView;
uniform vec4 uRect[${MAXB}]; uniform vec2 uMeta[${MAXB}];
uniform vec4 uS0[${MAXS}]; uniform vec4 uS1[${MAXS}]; uniform vec4 uS2[${MAXS}]; uniform vec3 uSC[${MAXS}];
float sdRound(vec2 p, vec2 c, vec2 hw, float r){
  vec2 q = abs(p-c) - hw + r;
  return min(max(q.x,q.y),0.0) + length(max(q,0.0)) - r;
}
float scene(vec2 p, out float sid, out vec4 rct, out float rad){
  float d = 1e9; sid = 0.0; rct = vec4(0.0); rad = 0.0;
  for(int i=0;i<${MAXB};i++){ if(i>=uCount) break;
    vec4 R = uRect[i];
    float di = sdRound(p, R.xy, R.zw, uMeta[i].x);
    if(di < d){ d = di; sid = uMeta[i].y; rct = R; rad = uMeta[i].x; } }
  return d;
}
float sceneD(vec2 p){ float s; vec4 rr; float rd; return scene(p,s,rr,rd); }
// p 是画布内坐标；背景按它在屏幕上的位置取样，和固定背景对得上
vec3 bg(vec2 p){ return texture2D(uTex, (p + uOrigin) / uView).rgb; }
vec3 bgB(vec2 p, float rad){
  vec3 s = bg(p);
  if(rad > 0.5){
    s += bg(p+vec2(rad,0.0)) + bg(p+vec2(-rad,0.0)) + bg(p+vec2(0.0,rad)) + bg(p+vec2(0.0,-rad));
    float r2 = rad * 0.7071;
    s += bg(p+vec2(r2,r2)) + bg(p+vec2(-r2,r2)) + bg(p+vec2(r2,-r2)) + bg(p+vec2(-r2,-r2));
    s /= 9.0;
  }
  return s;
}
void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  float sid; vec4 rct; float rad; float d = scene(p, sid, rct, rad);
  // 取这个气泡主人的那套参数
  vec4 A = uS0[0]; vec4 B = uS1[0]; vec4 C = uS2[0]; vec3 T = uSC[0];
  for(int j=1;j<${MAXS};j++){ if(float(j) == sid){ A = uS0[j]; B = uS1[j]; C = uS2[j]; T = uSC[j]; } }
  float uStrength = A.x, uEdge = A.y, uRimPow = A.z, uChroma = A.w;
  float uGlow = B.x, uTint = B.y, uBlur = B.z, uTrans = B.w;
  float uVol = C.x, uContrast = C.y, uShadow = C.z;

  // 画布是透明的：只画玻璃本体和它投下的阴影（黑色半透明）
  vec4 outc = vec4(0.0);
  if(d > 0.0 && uShadow > 0.001){
    float dS = sdRound(p - vec2(5.0, 8.0), rct.xy, rct.zw, rad);
    float shadow = uShadow * smoothstep(20.0, 0.0, dS) * smoothstep(-1.0, 6.0, d);
    outc = vec4(0.0, 0.0, 0.0, shadow * 0.6 * 0.45);
  }
  float alpha = smoothstep(1.6, -1.6, d);
  if(alpha > 0.001){
    float e = 1.5;
    vec2 g = normalize(vec2(sceneD(p+vec2(e,0.))-sceneD(p-vec2(e,0.)),
                            sceneD(p+vec2(0.,e))-sceneD(p-vec2(0.,e))) + 1e-6);
    float dIn = -d;
    vec2 hf = max(rct.zw, vec2(1.0));
    vec2 lp = (p - rct.xy) / hf;
    vec2 Ldir = normalize(vec2(-0.55, -0.83));
    float t = clamp(dIn / max(uEdge, 1.0), 0.0, 1.0);
    float lens = pow(1.0 - t, uRimPow);
    vec2 off = g * uStrength * lens;
    float blur = uBlur * (1.0 + lens * 0.6);
    vec3 refr;
    refr.r = bgB(p + off*(1.0+uChroma), blur).r;
    refr.g = bgB(p + off, blur).g;
    refr.b = bgB(p + off*(1.0-uChroma), blur).b;
    vec3 milk = vec3(0.86, 0.89, 0.95);
    vec3 glass = mix(milk, refr, clamp(uTrans, 0.0, 1.0));
    glass = mix(glass, T, uTint);
    float Lb = dot(refr, vec3(0.299, 0.587, 0.114));
    vec3 adapt = Lb > 0.5 ? vec3(0.05, 0.06, 0.08) : vec3(0.97, 0.98, 1.0);
    glass = mix(glass, adapt, clamp(uContrast, 0.0, 1.5) * 0.20);
    vec2 hp = lp - vec2(-0.42, -0.5);
    float vol = exp(-dot(hp, hp) * 1.5) * smoothstep(0.0, 7.0, dIn);
    glass += vec3(1.0) * vol * uVol;
    float rimHi = pow(1.0 - smoothstep(0.0, 5.0, dIn), 1.7);
    float ndl = dot(g, Ldir);
    glass += vec3(1.0) * rimHi * max(ndl, 0.0) * uGlow;
    glass *= 1.0 - rimHi * max(-ndl, 0.0) * 0.30;
    float spec = pow(max(ndl, 0.0), 22.0) * rimHi;
    glass += vec3(1.0) * spec * 0.35;
    outc = vec4(mix(outc.rgb, glass, alpha), max(outc.a, alpha));
  }
  gl_FragColor = outc;
}`;

const canvas = document.createElement('canvas'); canvas.id = 'gl';
const bgCanvas = $('#bg');
const MARGIN = 240;              // 玻璃画布比可视区上下各多画一截，快速滑动时新进来的气泡也有玻璃
let gl = null, glOn = false, loc = {}, tex, glDirty = true, lastSig = '';
const dpr = Math.min(devicePixelRatio || 1, 2);
let wallImg = null;
const slotOf = new Map();        // style key → 着色器里的参数槽位

function hexToVec(h){ const n = parseInt(h.slice(1), 16); return [((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255]; }
function compile(t, src){ const sh = gl.createShader(t); gl.shaderSource(sh, src); gl.compileShader(sh);
  if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); return sh; }
function initGL(){
  gl = canvas.getContext('webgl', { premultipliedAlpha:false, alpha:true, antialias:true });
  if(!gl) return false;
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
  const a = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
  ['uRes','uTex','uCount','uOrigin','uView'].forEach(n => loc[n] = gl.getUniformLocation(prog, n));
  ['uRect','uMeta','uS0','uS1','uS2','uSC'].forEach(n => loc[n] = gl.getUniformLocation(prog, n + '[0]'));
  tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.uniform1i(loc.uTex, 0);
  return true;
}
// 玻璃背后的场景：自己的背景图，或者群聊默认的紫蓝渐变（加几团柔光，折射才看得出来）
function buildScene(w, h){
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  if(wallImg){
    const ir = wallImg.width / wallImg.height, cr = w / h; let dw, dh;
    if(ir > cr){ dh = h; dw = h * ir; } else { dw = w; dh = w / ir; }
    x.drawImage(wallImg, (w - dw) / 2, (h - dh) / 2, dw, dh);
    x.fillStyle = 'rgba(15,16,32,0.22)'; x.fillRect(0, 0, w, h);
    return c;
  }
  x.fillStyle = '#0f1020'; x.fillRect(0, 0, w, h);
  [[0.15,0.0,1.0,'#3a2a7a'],[1.0,1.0,0.9,'#1d4a6e'],[0.8,0.25,0.5,'#5b3f9e'],[0.2,0.6,0.55,'#2b3f7a'],
   [0.6,0.8,0.45,'#6a4a8e'],[0.35,0.35,0.3,'#8a78c8']].forEach(([bx,by,rr,cl]) => {
    const r = rr * Math.max(w, h) * 0.5;
    const g = x.createRadialGradient(bx*w, by*h, 0, bx*w, by*h, r);
    g.addColorStop(0, cl); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0, 0, w, h);
  });
  return c;
}
// 同一张场景图：固定背景画布显示它，玻璃着色器折射它
function uploadTexture(){
  if(!glOn || !bgCanvas.width) return;
  const scene = buildScene(bgCanvas.width, bgCanvas.height);
  bgCanvas.getContext('2d').drawImage(scene, 0, 0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, scene);
  glDirty = true;
}
function setGlassWallpaper(src){
  if(!src){ wallImg = null; uploadTexture(); return; }
  const img = new Image(); img.onload = () => { wallImg = img; uploadTexture(); }; img.src = src;
}
function uploadStyles(){
  if(!glOn) return;
  const s0 = new Float32Array(MAXS*4), s1 = new Float32Array(MAXS*4), s2 = new Float32Array(MAXS*4), sc = new Float32Array(MAXS*3);
  const put = (i, sk) => { const st = styleOf(sk);
    s0.set([st.strength*dpr, st.edge*dpr, st.rimPow, st.chroma], i*4);
    s1.set([st.glow, st.tint, st.glassBlur*dpr, st.trans], i*4);
    s2.set([st.vol, st.contrast, st.shadow, 0], i*4);
    sc.set(hexToVec(st.color), i*3); };
  put(0, 'h:');
  for(const [sk, i] of slotOf) put(i, sk);
  gl.uniform4fv(loc.uS0, s0); gl.uniform4fv(loc.uS1, s1); gl.uniform4fv(loc.uS2, s2); gl.uniform3fv(loc.uSC, sc);
  glDirty = true;
}
function slot(sk){
  if(!slotOf.has(sk)){
    if(slotOf.size >= MAXS - 1) return 0;
    slotOf.set(sk, slotOf.size + 1); uploadStyles();
  }
  return slotOf.get(sk);
}
function resizeGL(){
  const vw = Math.round(bgCanvas.clientWidth * dpr), vh = Math.round(bgCanvas.clientHeight * dpr);
  if(vw && vh && (bgCanvas.width !== vw || bgCanvas.height !== vh)){
    bgCanvas.width = vw; bgCanvas.height = vh; gl.uniform2f(loc.uView, vw, vh); uploadTexture();
  }
  const cw = msgs.clientWidth, ch = list.clientHeight + 2 * MARGIN;
  const w = Math.round(cw * dpr), h = Math.round(ch * dpr);
  if(w && h && (canvas.width !== w || canvas.height !== h)){
    canvas.width = w; canvas.height = h; canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
    gl.viewport(0, 0, w, h); gl.uniform2f(loc.uRes, w, h); glDirty = true;
  }
}
function frame(){
  resizeGL();
  // 玻璃画布放在消息里一起滚动：两帧之间系统滚动时，玻璃和文字是一起移动的，不会分离
  const lr = list.getBoundingClientRect(), mr = msgs.getBoundingClientRect();
  const ox = mr.left, oy = lr.top - MARGIN;          // 画布左上角在屏幕上的位置
  const rects = new Float32Array(MAXB*4), metas = new Float32Array(MAXB*2); let n = 0;
  for(const el of msgs.querySelectorAll('.bubble')){
    if(n >= MAXB) break;
    const r = el.getBoundingClientRect(); if(r.width < 2 || r.height < 2) continue;
    if(r.bottom < oy || r.top > lr.bottom + MARGIN) continue;
    const hw = Math.round(r.width/2*dpr), hh = Math.round(r.height/2*dpr);
    let rad = parseFloat(getComputedStyle(el).borderTopLeftRadius) || 20;
    rects.set([Math.round((r.left - ox + r.width/2)*dpr), Math.round((r.top - oy + r.height/2)*dpr), hw, hh], n*4);
    metas.set([Math.round(Math.min(rad*dpr, hw, hh)), slot(el.closest('.row').dataset.sk)], n*2);
    n++;
  }
  // 只有气泡位置/大小/样式变了才重画，静止时不耗电
  const sig = n + ':' + rects.subarray(0, n*4).join(',') + '|' + metas.subarray(0, n*2).join(',') + '|' + ox + ',' + oy;
  if(sig !== lastSig || glDirty){
    lastSig = sig; glDirty = false;
    canvas.style.transform = `translate(0, ${oy - mr.top}px)`;   // 和这一帧的测量同步落位
    gl.uniform1i(loc.uCount, n);
    gl.uniform4fv(loc.uRect, rects); gl.uniform2fv(loc.uMeta, metas);
    gl.uniform2f(loc.uOrigin, ox * dpr, oy * dpr);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
}
try {
  if(initGL()){ glOn = true; document.body.classList.add('lg'); msgs.prepend(canvas); resizeGL(); uploadStyles(); requestAnimationFrame(frame); }
} catch(err){ console.warn('WebGL 不可用，用普通气泡：', err); glOn = false; }

/* ---------- 调气泡面板：我自己 + 我的 AI ---------- */
let stylerKey = '';
const myKeys = () => [['h:' + me, '我的气泡'], ...bots.filter(b => b.owner === me).map(b => ['b:' + b.id, b.name + ' 的气泡'])];
function openStyler(){ stylerKey = stylerKey && myKeys().some(k => k[0] === stylerKey) ? stylerKey : 'h:' + me; renderStyler(); $('#styler').classList.remove('hidden'); }
function renderStyler(){
  const keys = myKeys(), st = styleOf(stylerKey);
  const noBot = bots.length && !bots.some(b => b.owner === me);
  $('#styler').innerHTML = `<div class="tabs">${keys.map(([k, t]) => `<button class="tab${k === stylerKey ? ' on' : ''}" data-k="${esc(k)}">${esc(t)}</button>`).join('')}<button class="x" aria-label="关闭">✕</button></div>`
    + (noBot ? `<div class="hint">没找到你的 AI：配置里 AI 的 owner 要和你的昵称「${esc(me)}」一样</div>` : '')
    + `<div class="hint">拖动时对方那边会实时跟着变</div>`
    + `<div class="colorrow">气泡颜色<input type="color" id="st-color" value="${st.color}"></div>`
    + STYLE_SPEC.map(([k, label, lo, hi, step]) => `<label>${label} <output id="sv-${k}"></output><input type="range" id="st-${k}" min="${lo}" max="${hi}" step="${step}" value="${st[k]}"></label>`).join('')
    + `<button class="reset">恢复默认</button>`;
  syncStyler();
}
function syncStyler(){
  const st = styleOf(stylerKey);
  for(const [k] of STYLE_SPEC){ const r = $('#st-' + k); if(r && document.activeElement !== r) r.value = st[k]; const o = $('#sv-' + k); if(o) o.textContent = +(+st[k]).toFixed(2); }
  const c = $('#st-color'); if(c && document.activeElement !== c) c.value = st.color;
}
let pushTimer = null;
function pushStyle(sk){
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {
    const body = { name: me, style: styles[sk] || null };
    if(sk.startsWith('b:')) body.bot = sk.slice(2);
    api('/api/style', { method: 'POST', body: JSON.stringify(body) }).catch(e => alert('保存失败：' + e.message));
  }, 150);
}
$('#styler').addEventListener('input', e => {
  const id = e.target.id; if(!id.startsWith('st-')) return;
  const k = id.slice(3), v = k === 'color' ? e.target.value : +e.target.value;
  styles[stylerKey] = { ...styleOf(stylerKey), [k]: v };
  editedAt[stylerKey] = Date.now();
  applyGeometry(); uploadStyles(); syncStyler(); pushStyle(stylerKey);
});
$('#styler').addEventListener('click', e => {
  if(e.target.classList.contains('x')) $('#styler').classList.add('hidden');
  if(e.target.dataset.k){ stylerKey = e.target.dataset.k; renderStyler(); }
  if(e.target.classList.contains('reset')){ delete styles[stylerKey]; editedAt[stylerKey] = Date.now(); applyGeometry(); uploadStyles(); syncStyler(); pushStyle(stylerKey); }
});

/* ---------- 头像 ---------- */
function paintAvatar(el){
  const [k, ...rest] = el.dataset.av.split(':'); const id = rest.join(':');
  const src = (k === 'b' ? avatars.bots : avatars.humans)[id];
  if(src){ const img = new Image(); img.src = src; img.alt = ''; el.replaceChildren(img); }
  else el.textContent = el.dataset.fb;
}
const paintAll = () => document.querySelectorAll('[data-av]').forEach(paintAvatar);

// 把选的图压小：头像裁成正方形 256px，背景最长边 1440px
async function shrink(file, max, square){
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    let sw = img.naturalWidth, sh = img.naturalHeight, sx = 0, sy = 0;
    if(square){ const d = Math.min(sw, sh); sx = (sw - d) / 2; sy = (sh - d) / 2; sw = sh = d; }
    const k = Math.min(1, max / Math.max(sw, sh));
    const cv = document.createElement('canvas');
    cv.width = Math.round(sw * k); cv.height = Math.round(sh * k);
    const g = cv.getContext('2d');
    g.fillStyle = '#1a1438'; g.fillRect(0, 0, cv.width, cv.height);
    g.drawImage(img, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', square ? 0.85 : 0.8);
  } finally { URL.revokeObjectURL(url); }
}
function pickImage(){
  return new Promise(resolve => {
    const p = $('#picker'); p.value = '';
    p.onchange = () => resolve(p.files[0] || null);
    p.click();
  });
}
async function changeAvatar(target){
  const file = await pickImage(); if(!file) return;
  try {
    const image = await shrink(file, 256, true);
    await api('/api/avatar', { method: 'POST', body: JSON.stringify({ ...target, image }) });
  } catch(e){ alert('换头像失败：' + e.message); }
}

/* ---------- 背景图（只存在自己浏览器里，别人看不到） ---------- */
function applyWall(src){
  $('#wall').style.backgroundImage = src ? `linear-gradient(rgba(15,16,32,.45),rgba(15,16,32,.45)), url("${src}")` : '';
  setGlassWallpaper(src);
}
async function changeWall(){
  const file = await pickImage(); if(!file) return;
  try {
    const src = await shrink(file, 1440, false);
    applyWall(src);
    try { localStorage.setItem('gc-wall', src); }
    catch(e){ alert('浏览器存不下这张图，这次先用着，下次打开会恢复默认'); }
  } catch(e){ alert('这张图打不开：' + e.message); }
}

/* ---------- 菜单 ---------- */
function openMenu(){
  const m = $('#menu');
  m.innerHTML = `<button data-act="me">🙂 换我的头像</button>`
    + bots.map(b => `<button data-act="bot" data-id="${esc(b.id)}">${esc(b.avatar || '🤖')} 换 ${esc(b.name)} 的头像</button>`).join('')
    + `<div class="note">头像所有人都能看到</div><hr>`
    + (glOn ? `<button data-act="style">🫧 调我的液态玻璃气泡</button><div class="note">你和你的 AI 的气泡，所有人都能看到</div><hr>` : '')
    + `<button data-act="wall">🖼️ 换背景图</button><button data-act="nowall">↩️ 恢复默认背景</button>`
    + `<div class="note">背景只有你自己能看到</div>`;
  m.classList.remove('hidden');
}
$('#menuBtn').onclick = e => { e.stopPropagation(); $('#menu').classList.contains('hidden') ? openMenu() : $('#menu').classList.add('hidden'); };
document.addEventListener('click', e => { if(!e.target.closest('#menu')) $('#menu').classList.add('hidden'); });
$('#menu').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  $('#menu').classList.add('hidden');
  const act = b.dataset.act;
  if(act === 'me') changeAvatar({ name: me });
  if(act === 'bot') changeAvatar({ bot: b.dataset.id });
  if(act === 'wall') changeWall();
  if(act === 'style') openStyler();
  if(act === 'nowall'){ applyWall(''); try { localStorage.removeItem('gc-wall'); } catch(e){} }
});
applyWall(store.get('gc-wall'));

function connect(){
  es?.close();
  es = new EventSource('api/events?key=' + encodeURIComponent(key));
  es.addEventListener('open', () => $('#dot').classList.add('on'));
  es.addEventListener('error', () => $('#dot').classList.remove('on'));
  es.addEventListener('avatars', e => { avatars = JSON.parse(e.data); paintAll(); });
  es.addEventListener('styles', e => { onServerStyles(JSON.parse(e.data)); });
  es.addEventListener('history', e => {
    msgs.replaceChildren(...(glOn ? [canvas] : [])); els.clear(); lastTs = 0;
    JSON.parse(e.data).forEach(render);
    toBottom(true);
  });
  es.addEventListener('msg', e => { const m = JSON.parse(e.data); const stick = nearBottom() || m.name === me; render(m); toBottom(stick); });
  es.addEventListener('delta', e => {
    const { id, text } = JSON.parse(e.data); const el = els.get(id); if(!el) return;
    const stick = nearBottom();
    el.text += text; el.bubble.innerHTML = fmt(el.text); toBottom(stick);
  });
  es.addEventListener('done', e => update(JSON.parse(e.data)));
  es.addEventListener('remove', e => { const { id } = JSON.parse(e.data); els.get(id)?.row.remove(); els.delete(id); });
}

async function send(){
  const text = $('#box').value.trim(); if(!text) return;
  $('#send').disabled = true;
  try {
    await api('/api/send', { method: 'POST', body: JSON.stringify({ name: me, text }) });
    $('#box').value = ''; grow();
  } catch(e){ alert('发送失败：' + e.message); }
  $('#send').disabled = false;
  $('#box').focus();
}

function grow(){ const b = $('#box'); b.style.height = 'auto'; b.style.height = Math.min(b.scrollHeight, 140) + 'px'; }

async function enter(){
  try {
    const info = await api('/api/info');
    bots = info.bots;
    document.title = info.title;
    $('#title').textContent = info.title;
    $('#members').textContent = bots.map(b => (b.avatar || '🤖') + b.name).join(' ');
    $('#chips').innerHTML = bots.map(b => `<button class="chip" data-at="${esc(b.name)}">@${esc(b.name)}</button>`).join('')
      + '<button class="chip stop" id="stop">✋ 让 AI 停一下</button>';
    $('#login').classList.add('hidden');
    connect();
  } catch(e){
    $('#login').classList.remove('hidden');
    $('#lname').value = me;
    if(e.status === 401 && key) $('#lerr').textContent = '口令不对，再试试';
  }
}

$('#lgo').onclick = () => {
  me = $('#lname').value.trim(); key = $('#lkey').value.trim();
  if(!me){ $('#lerr').textContent = '先起个昵称～'; return; }
  store.set('gc-name', me); store.set('gc-key', key);
  $('#lerr').textContent = '';
  enter();
};
$('#lkey').addEventListener('keydown', e => { if(e.key === 'Enter') $('#lgo').click(); });
$('#send').onclick = send;
$('#box').addEventListener('input', grow);
$('#box').addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(pointer:fine)').matches){ e.preventDefault(); send(); }
});
$('#chips').addEventListener('click', e => {
  const at = e.target.dataset.at;
  if(at){ const b = $('#box'); b.value = (b.value ? b.value.replace(/\s*$/, ' ') : '') + '@' + at + ' '; b.focus(); grow(); }
  if(e.target.id === 'stop') api('/api/stop', { method: 'POST' }).catch(() => {});
});

if(me) enter(); else $('#login').classList.remove('hidden');
</script>
